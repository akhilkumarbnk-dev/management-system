<style>
    /* 1. CINEMATIC DEEP SPACE BACKGROUND */
    .home-bg-3d {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: radial-gradient(circle at center, #050811 0%, #010203 100%);
        z-index: -2; overflow: hidden;
    }
    .space-dust {
        position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background-image: 
            radial-gradient(2px 2px at 40px 60px, rgba(255,255,255,0.4), transparent),
            radial-gradient(1px 1px at 150px 180px, rgba(0,243,255,0.3), transparent);
        background-size: 200px 200px;
        animation: floatDust 80s linear infinite; opacity: 0.6;
    }
    @keyframes floatDust { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-300px) rotate(5deg); } }

    /* 2. MASTER CONSTELLATION WRAPPER */
    .neural-network-wrapper {
        position: relative; width: 100%; height: calc(100vh - 60px); 
        overflow: hidden; z-index: 1; font-family: 'Orbitron', sans-serif;
    }

    /* 3. SVG ENERGY LINES (Connecting Core to 8 Nodes) */
    .energy-lines-container {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
        pointer-events: none;
    }
    .energy-line {
        stroke: rgba(0, 243, 255, 0.15); stroke-width: 1.5;
        stroke-dasharray: 5, 10; animation: energyFlow 30s linear infinite;
    }
    @keyframes energyFlow { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }

    /* 4. THE CORE (Center Logo) */
    .core-node {
        position: absolute; top: 50%; left: 50%;
        display: flex; flex-direction: column; align-items: center; z-index: 10;
        /* Custom parallax anchor setup via JS */
    }
    .core-logo-box {
        width: 140px; height: 140px; border-radius: 50%; padding: 8px;
        background: rgba(0, 0, 0, 0.8); border: 2px solid #00f3ff;
        box-shadow: 0 0 50px rgba(0, 243, 255, 0.5), inset 0 0 30px rgba(0,243,255,0.3);
    }
    .core-logo-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .core-pulse {
        position: absolute; top: -15%; left: -15%; width: 130%; height: 130%;
        border-radius: 50%; border: 1px dashed rgba(0, 243, 255, 0.6);
        animation: pulseCore 3s infinite linear; z-index: -1;
    }
    @keyframes pulseCore { 0% { transform: scale(0.9) rotate(0deg); opacity: 1; } 100% { transform: scale(1.6) rotate(90deg); opacity: 0; } }
    
    .live-clock-badge {
        margin-top: 25px; background: rgba(0, 243, 255, 0.05); padding: 5px 15px; 
        border-radius: 4px; border: 1px solid rgba(0, 243, 255, 0.3); 
        color: #00f3ff; font-size: 12px; letter-spacing: 2px;
    }

    /* 5. FLOATING HUD CARDS (Scattered & Sci-Fi Shaped) */
    .hud-card {
        position: absolute; 
        background: rgba(10, 15, 30, 0.5); padding: 20px 25px;
        border-left: 3px solid #00f3ff; 
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        backdrop-filter: blur(8px);
        /* JARVIS CORNER CUT (Sci-Fi Box) */
        clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        display: flex; flex-direction: column; justify-content: center; z-index: 5;
    }
    .hud-card:hover { background: rgba(0, 243, 255, 0.1); border-left-color: #fff; box-shadow: 0 0 30px rgba(0, 243, 255, 0.2); }
    
    .stat-header { font-size: 11px; color: #a5c3e0; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; display: flex; gap: 8px; align-items: center; }
    .stat-value { font-size: 36px; color: #fff; font-family: 'Poppins', sans-serif; font-weight: 700; margin: 0; }

    /* Asymmetric Card Placements & Sizes */
    .node-collection { top: 15%; left: 75%; width: 340px; border-left-color: #00ff88; }
    .node-collection .stat-value { color: #00ff88; font-size: 42px; }
    
    .node-admissions { top: 22%; left: 20%; width: 230px; border-left-color: #b366ff; }
    .node-students { top: 75%; left: 18%; width: 280px; border-left-color: #00f3ff; }
    
    .node-alerts { top: 78%; left: 78%; width: 260px; border-left-color: #ff0055; cursor: pointer; }
    .node-alerts .stat-value { color: #ff0055; }

    /* 6. ACTION BUTTONS (Satellite Nodes) */
    .action-satellite {
        position: absolute; 
        width: 80px; height: 80px; border-radius: 50%;
        background: rgba(0, 0, 0, 0.6); border: 1px dashed rgba(0, 243, 255, 0.4);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
        cursor: pointer; z-index: 8; transition: 0.3s;
    }
    .action-satellite i { font-size: 22px; color: #00f3ff; transition: 0.3s; }
    .action-satellite span { font-size: 9px; color: #a5c3e0; letter-spacing: 1px; text-transform: uppercase; text-align: center; }
    
    .action-satellite:hover { border-style: solid; border-color: #00f3ff; background: rgba(0, 243, 255, 0.15); box-shadow: 0 0 25px rgba(0, 243, 255, 0.4); transform: scale(1.1) translate(-50%, -50%) !important; }
    .action-satellite:hover i { color: #fff; text-shadow: 0 0 10px #00f3ff; }

    /* Scattered Satellite Positions */
    .sat-admission { top: 45%; left: 10%; }
    .sat-fee { top: 12%; left: 50%; }
    .sat-search { top: 88%; left: 45%; }
    .sat-reports { top: 50%; left: 90%; }

</style>

<!-- BACKGROUND -->
<div class="home-bg-3d"><div class="space-dust"></div></div>

<div class="neural-network-wrapper" id="parallaxArea">
    
    <!-- SVG ENERGY LINES (Exact connections to all 8 nodes) -->
    <svg class="energy-lines-container">
        <!-- Cards -->
        <line x1="50%" y1="50%" x2="75%" y2="15%" class="energy-line" />
        <line x1="50%" y1="50%" x2="20%" y2="22%" class="energy-line" />
        <line x1="50%" y1="50%" x2="18%" y2="75%" class="energy-line" />
        <line x1="50%" y1="50%" x2="78%" y2="78%" class="energy-line" />
        <!-- Satellites -->
        <line x1="50%" y1="50%" x2="10%" y2="45%" class="energy-line" style="stroke-width:0.5; stroke-dasharray: 2,4;" />
        <line x1="50%" y1="50%" x2="50%" y2="12%" class="energy-line" style="stroke-width:0.5; stroke-dasharray: 2,4;" />
        <line x1="50%" y1="50%" x2="45%" y2="88%" class="energy-line" style="stroke-width:0.5; stroke-dasharray: 2,4;" />
        <line x1="50%" y1="50%" x2="90%" y2="50%" class="energy-line" style="stroke-width:0.5; stroke-dasharray: 2,4;" />
    </svg>

    <!-- THE CORE -->
    <div class="core-node js-holo" data-speed="5" data-dir-x="-1" data-dir-y="-1" style="top: 50%; left: 50%;">
        <div class="core-logo-box">
            <img src="logo.png" alt="Purix Academy">
            <div class="core-pulse"></div>
        </div>
        <div class="live-clock-badge" id="realtimeClock">Loading Time...</div>
    </div>

    <!-- FLOATING HUD CARDS (Data) -->
    <div class="hud-card node-collection js-holo" data-speed="15" data-dir-x="1" data-dir-y="1" style="top: 15%; left: 75%;">
        <div class="stat-header"><i class="fa-solid fa-wallet"></i> Collection</div>
        <h2 class="stat-value" id="homeTodayCollection"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
    </div>

    <div class="hud-card node-admissions js-holo" data-speed="25" data-dir-x="-1" data-dir-y="1" style="top: 22%; left: 20%;">
        <div class="stat-header"><i class="fa-solid fa-user-plus"></i> Admissions</div>
        <h2 class="stat-value" id="homeMonthAdmission"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
    </div>

    <div class="hud-card node-students js-holo" data-speed="12" data-dir-x="1" data-dir-y="-1" style="top: 75%; left: 18%;">
        <div class="stat-header"><i class="fa-solid fa-users"></i> Students</div>
        <h2 class="stat-value" id="homeActiveStudents"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
    </div>

    <div class="hud-card node-alerts js-holo" data-speed="30" data-dir-x="-1" data-dir-y="-1" style="top: 78%; left: 78%;" onclick="loadModule('alerts')">
        <div class="stat-header"><i class="fa-solid fa-bell"></i> Alerts</div>
        <h2 class="stat-value" id="alertCount"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
    </div>

    <!-- FLOATING SATELLITE BUTTONS (Actions) -->
    <div class="action-satellite sat-admission js-holo" data-speed="40" data-dir-x="1" data-dir-y="1" style="top: 45%; left: 10%;" onclick="loadModule('admission')">
        <i class="fa-solid fa-id-card-clip"></i><span>Admit</span>
    </div>
    
    <div class="action-satellite sat-fee js-holo" data-speed="35" data-dir-x="-1" data-dir-y="1" style="top: 12%; left: 50%;" onclick="loadModule('payment')">
        <i class="fa-solid fa-hand-holding-dollar"></i><span>Fee</span>
    </div>

    <div class="action-satellite sat-search js-holo" data-speed="20" data-dir-x="-1" data-dir-y="-1" style="top: 88%; left: 45%;" onclick="loadModule('profile')">
        <i class="fa-solid fa-magnifying-glass-chart"></i><span>Search</span>
    </div>

    <div class="action-satellite sat-reports js-holo" data-speed="45" data-dir-x="1" data-dir-y="-1" style="top: 50%; left: 90%;" onclick="loadModule('reports')">
        <i class="fa-solid fa-file-invoice"></i><span>Reports</span>
    </div>

</div>

<script>
    (function() {
        // --- 1. JARVIS INDEPENDENT PARALLAX ENGINE ---
        // Har element ki ek speed (data-speed) aur direction (data-dir-x) lagayi gayi hai.
        const wrapper = document.getElementById('parallaxArea');
        const holograms = document.querySelectorAll('.js-holo');

        wrapper.addEventListener('mousemove', (e) => {
            // Mouse ki position nikali gayi screen ke center se
            const x = (e.clientX / window.innerWidth - 0.5); 
            const y = (e.clientY / window.innerHeight - 0.5);
            
            holograms.forEach(holo => {
                const speed = parseFloat(holo.getAttribute('data-speed')) || 10;
                const dirX = parseFloat(holo.getAttribute('data-dir-x')) || 1;
                const dirY = parseFloat(holo.getAttribute('data-dir-y')) || 1;
                
                // Translate(-50%, -50%) zaroori hai elements ko unke percentage coordinates par center rakhne ke liye
                holo.style.transform = `translate(-50%, -50%) translate(${x * speed * dirX}px, ${y * speed * dirY}px)`;
            });
        });

        // --- 2. LOGIC SECTION (STRICTLY UNTOUCHED) ---

        function updateClock() {
            const clockElement = document.getElementById('realtimeClock');
            if (!clockElement) return; 
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            const dateString = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
            clockElement.innerText = `${dateString} | ${timeString}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        const CACHE_DURATION_MS = 5 * 60 * 1000; 
        function loadDashboardData() {
            const now = new Date().getTime();
            const cachedStatsString = localStorage.getItem('purix_home_stats');
            let cachedStats = null;
            if (cachedStatsString) { try { cachedStats = JSON.parse(cachedStatsString); } catch (e) {} }

            if (cachedStats && cachedStats.timestamp && (now - cachedStats.timestamp < CACHE_DURATION_MS)) {
                updateStatsUI(cachedStats.data);
            } else {
                fetch(API_URL + "?action=getStats")
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") {
                            updateStatsUI(data.data);
                            localStorage.setItem('purix_home_stats', JSON.stringify({ timestamp: now, data: data.data }));
                        }
                    });
            }

            const todayStr = new Date().toDateString();
            const cachedAlertsDate = localStorage.getItem('purix_alerts_date');
            const cachedAlertsData = localStorage.getItem('purix_alerts_data');

            if (cachedAlertsDate === todayStr && cachedAlertsData) {
                document.getElementById('alertCount').innerText = countRealOverdueAlerts(JSON.parse(cachedAlertsData));
            } else {
                fetch(API_URL + "?action=getAlerts")
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") {
                            localStorage.setItem('purix_alerts_date', todayStr);
                            localStorage.setItem('purix_alerts_data', JSON.stringify(data.data));
                            document.getElementById('alertCount').innerText = countRealOverdueAlerts(data.data);
                        }
                    });
            }
        }

        function updateStatsUI(data) {
            if (!data) return;
            if (data.todayAdmissions === undefined && data.monthAdmission !== undefined) {
                localStorage.removeItem('purix_home_stats'); 
            }
            let active = data.activeStudents !== undefined ? data.activeStudents : 0;
            let admissions = data.todayAdmissions !== undefined ? data.todayAdmissions : (data.monthAdmission || 0);
            let collection = data.todayCollection !== undefined ? data.todayCollection : 0;

            document.getElementById('homeActiveStudents').innerText = active;
            document.getElementById('homeMonthAdmission').innerText = admissions;
            document.getElementById('homeTodayCollection').innerText = "₹" + collection;
        }

        function countRealOverdueAlerts(alertsList) {
            let criticalCount = 0;
            alertsList.forEach(student => {
                let due = new Date(student.dueDate);
                if (!isNaN(due.getTime())) {
                    due.setHours(0,0,0,0);
                    let today = new Date(); today.setHours(0,0,0,0);
                    let diff = Math.ceil((due.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
                    if (diff < 0) criticalCount++; 
                }
            });
            return criticalCount;
        }

        loadDashboardData();
        setInterval(loadDashboardData, 60000); 
    })();
</script>
