<style>
    /* padding-top badha diya taaki banner thoda niche aa jaye */
    .home-wrapper { display: flex; flex-direction: column; gap: 30px; position: relative; padding-top: 60px; }

    /* Sci-Fi Welcome Banner HUD */
    .welcome-banner {
        background: linear-gradient(135deg, rgba(0, 243, 255, 0.1) 0%, rgba(179, 102, 255, 0.15) 100%);
        border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 16px; padding: 40px;
        display: flex; justify-content: space-between; align-items: center;
        box-shadow: inset 0 0 30px rgba(0, 243, 255, 0.05), 0 10px 30px rgba(0,0,0,0.5);
        color: #fff; position: relative; overflow: hidden; backdrop-filter: blur(5px);
    }
    .welcome-banner::after {
        content: ''; position: absolute; top: -50%; right: -5%; width: 300px; height: 300px;
        background: radial-gradient(circle, rgba(0,243,255,0.15) 0%, transparent 60%); border-radius: 50%;
    }
    
    .welcome-text h1 { margin: 0 0 10px 0; font-size: 32px; color: #00f3ff; text-shadow: 0 0 15px rgba(0, 243, 255, 0.6); }
    .welcome-text p { margin: 0; font-size: 15px; color: #a5c3e0; font-family: 'Poppins', sans-serif; letter-spacing: 1px; }

    /* 3D Glowing Banner Logo */
    .banner-logo {
        width: 110px; height: 110px; border-radius: 50%; perspective: 1000px; padding: 5px;
        background: rgba(0, 0, 0, 0.5); border: 2px solid #00f3ff; box-shadow: 0 0 25px rgba(0, 243, 255, 0.4); z-index: 2;
    }
    .banner-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; animation: earthRotate 8s linear infinite; transform-style: preserve-3d; }
    @keyframes earthRotate { 0% { transform: rotateY(0deg) rotateZ(10deg); } 50% { transform: rotateY(180deg) rotateZ(10deg); } 100% { transform: rotateY(360deg) rotateZ(10deg); } }

    /* Neon Data Cards */
    .stats-container { display: flex; gap: 20px; flex-wrap: wrap; }
    
    .stat-card {
        flex: 1; min-width: 250px; background: rgba(11, 16, 33, 0.8); padding: 25px; border-radius: 12px;
        border: 1px solid rgba(0, 243, 255, 0.2); box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        display: flex; align-items: center; gap: 20px; transition: 0.4s ease; position: relative; overflow: hidden;
    }
    .stat-card:hover { transform: translateY(-5px); border-color: #00f3ff; box-shadow: 0 0 25px rgba(0, 243, 255, 0.2); }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: #00f3ff; box-shadow: 0 0 15px #00f3ff; }
    
    .icon-box { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0,243,255,0.2); }
    
    /* Individual Neon Colors for Cards */
    .icon-students { color: #00f3ff; text-shadow: 0 0 10px #00f3ff; border-color: rgba(0,243,255,0.3); }
    .card-admission::before { background: #ff0055; box-shadow: 0 0 15px #ff0055; }
    .icon-admission { color: #ff0055; border-color: rgba(255,0,85,0.3); text-shadow: 0 0 10px #ff0055; background: rgba(255,0,85,0.05); }
    .card-collection::before { background: #00ff88; box-shadow: 0 0 15px #00ff88; }
    .icon-collection { color: #00ff88; border-color: rgba(0,255,136,0.3); text-shadow: 0 0 10px #00ff88; background: rgba(0,255,136,0.05); }

    .stat-details h4 { margin: 0 0 5px 0; font-size: 12px; color: #647b9e; font-family: 'Poppins', sans-serif; letter-spacing: 2px; }
    .stat-details h2 { margin: 0; font-size: 26px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

    /* Cybernetic Action Grid */
    .quick-actions-section { background: rgba(11, 16, 33, 0.8); padding: 25px; border-radius: 16px; border: 1px solid rgba(179, 102, 255, 0.2); box-shadow: inset 0 0 20px rgba(179,102,255,0.05); margin-bottom: 20px;}
    .quick-actions-section h3 { margin: 0 0 20px 0; color: #b366ff; text-shadow: 0 0 10px rgba(179,102,255,0.4); font-size: 18px; }
    
    .actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .action-btn { background: rgba(0, 0, 0, 0.5); border: 1px dotted rgba(0, 243, 255, 0.3); padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; transition: 0.3s; color: #a5c3e0; display: flex; flex-direction: column; align-items: center; gap: 10px; font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 1px; }
    .action-btn i { font-size: 22px; color: #00f3ff; transition: 0.3s; }
    .action-btn:hover { background: rgba(0, 243, 255, 0.1); border: 1px solid #00f3ff; box-shadow: inset 0 0 10px rgba(0,243,255,0.2), 0 0 15px rgba(0,243,255,0.3); color: #fff; transform: translateY(-3px); text-shadow: 0 0 5px #00f3ff; }
    .action-btn:hover i { color: #fff; text-shadow: 0 0 15px #00f3ff; }

    /* Pulsing Neon Alert */
    .home-floating-alert { position: absolute; top: 10px; right: 10px; background: rgba(255, 0, 85, 0.1); color: #ff0055; padding: 6px 18px; border-radius: 4px; border: 1px solid #ff0055; font-size: 12px; cursor: pointer; box-shadow: 0 0 15px rgba(255, 0, 85, 0.3); animation: pulseAlert 2s infinite; z-index: 10; display: flex; align-items: center; gap: 8px; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; transition: 0.3s;}
    .home-floating-alert:hover { background: #ff0055; color: #fff; box-shadow: 0 0 25px rgba(255, 0, 85, 0.6); }
    @keyframes pulseAlert { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.5); } 70% { box-shadow: 0 0 0 10px rgba(255, 0, 85, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); } }
</style>

<div class="home-wrapper">
    <!-- Floating Cyber Alert -->
    <div id="home-side-alert" class="home-floating-alert" onclick="loadModule('alerts')">
        <i class="fa-solid fa-triangle-exclamation"></i> <span id="alertCount">0</span> CRITICAL ALERTS
    </div>

    <!-- Sci-Fi HUD Banner -->
    <div class="welcome-banner">
        <div class="welcome-text">
            <h1>Purix Academy</h1>
            <p>New way of learning</p>
        </div>
        <div class="banner-logo">
            <img src="logo.png" alt="Purix Academy Hologram">
        </div>
    </div>

    <!-- Neon Stat Terminals -->
    <div class="stats-container">
        <div class="stat-card card-students">
            <div class="icon-box icon-students"><i class="fa-solid fa-users-viewfinder"></i></div>
            <div class="stat-details">
                <h4>ACTIVE PROTOCOLS</h4>
                <h2 id="homeActiveStudents"><i class="fa-solid fa-spinner fa-spin" style="font-size: 16px;"></i></h2>
            </div>
        </div>
        
        <div class="stat-card card-admission">
            <div class="icon-box icon-admission"><i class="fa-solid fa-user-astronaut"></i></div>
            <div class="stat-details">
                <h4>NEW ENROLLMENTS</h4>
                <h2 id="homeMonthAdmission"><i class="fa-solid fa-spinner fa-spin" style="font-size: 16px;"></i></h2>
            </div>
        </div>

        <div class="stat-card card-collection">
            <div class="icon-box icon-collection"><i class="fa-solid fa-bolt"></i></div>
            <div class="stat-details">
                <h4>CREDITS COLLECTED</h4>
                <h2 id="homeTodayCollection"><i class="fa-solid fa-spinner fa-spin" style="font-size: 16px;"></i></h2>
            </div>
        </div>
    </div>

    <!-- Quick Action Matrix -->
    <div class="quick-actions-section">
        <h3><i class="fa-solid fa-microchip"></i> COMMAND MATRIX</h3>
        <div class="actions-grid">
            <div class="action-btn" onclick="loadModule('admission')">
                <i class="fa-solid fa-id-badge"></i>
                <span>New Admission</span>
            </div>
            <div class="action-btn" onclick="loadModule('payment')">
                <i class="fa-solid fa-fingerprint"></i>
                <span>Collect Fee</span>
            </div>
            <div class="action-btn" onclick="loadModule('profile')">
                <i class="fa-solid fa-satellite-dish"></i>
                <span>Search Profile</span>
            </div>
            <div class="action-btn" onclick="loadModule('reports')">
                <i class="fa-solid fa-chart-network"></i>
                <span>View Reports</span>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // Automatically fetch data for the dashboard when this module loads
        if (typeof fetchHomeStats === 'function') {
            fetchHomeStats();
        }
        
        // Fetch critical alerts count specifically
        fetch(API_URL + "?action=getAlerts")
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    document.getElementById('alertCount').innerText = data.data.length;
                    if(data.data.length === 0) {
                        document.getElementById('home-side-alert').style.display = 'none';
                    } else {
                        document.getElementById('home-side-alert').style.display = 'flex';
                    }
                }
            })
            .catch(e => console.log("Alert fetching silent fail", e));
    })();
</script>
