<style>
    /* 1. CINEMATIC DEEP SPACE BACKGROUND */
    .home-bg-3d {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: radial-gradient(circle at center, #0a0f1d 0%, #010205 100%);
        z-index: -2; overflow: hidden;
    }
    .space-dust {
        position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background-image: 
            radial-gradient(2px 2px at 40px 60px, rgba(255,255,255,0.5), transparent),
            radial-gradient(2px 2px at 150px 180px, rgba(0,243,255,0.4), transparent);
        background-size: 250px 250px;
        animation: floatDust 100s linear infinite; opacity: 0.6;
    }
    @keyframes floatDust { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-300px) rotate(5deg); } }

    /* 2. MASTER CONSTELLATION WRAPPER */
    .neural-network-wrapper {
        position: relative; width: 100%; height: calc(100vh - 60px); 
        overflow: hidden; z-index: 1;
    }

    /* 3. SVG ENERGY LINES (Connecting Core to Nodes) */
    .energy-lines-container {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
        pointer-events: none; /* Mouse iske aar-paar ja sake */
    }
    .energy-line {
        stroke: rgba(0, 243, 255, 0.3); stroke-width: 2;
        stroke-dasharray: 10, 15; animation: energyFlow 20s linear infinite;
        filter: drop-shadow(0 0 8px rgba(0,243,255,0.5));
    }
    .line-collection { stroke: rgba(0, 255, 136, 0.3); filter: drop-shadow(0 0 8px rgba(0,255,136,0.5)); }
    .line-alerts { stroke: rgba(255, 0, 85, 0.3); filter: drop-shadow(0 0 8px rgba(255,0,85,0.5)); }
    .line-admissions { stroke: rgba(179, 102, 255, 0.3); filter: drop-shadow(0 0 8px rgba(179,102,255,0.5)); }
    
    @keyframes energyFlow { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }

    /* 4. THE CORE (Center Logo) */
    .core-node {
        position: absolute; top: 45%; left: 50%;
        transform: translate(-50%, -50%);
        display: flex; flex-direction: column; align-items: center; z-index: 10;
        transition: transform 0.2s ease-out;
    }
    .core-logo-box {
        width: 130px; height: 130px; border-radius: 50%; padding: 8px;
        background: rgba(0, 0, 0, 0.8); border: 2px solid #00f3ff;
        box-shadow: 0 0 40px rgba(0, 243, 255, 0.6), inset 0 0 20px rgba(0,243,255,0.3);
        position: relative;
    }
    .core-logo-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; z-index: 2; position: relative; }
    .core-pulse {
        position: absolute; top: -20%; left: -20%; width: 140%; height: 140%;
        border-radius: 50%; border: 1px solid rgba(0, 243, 255, 0.5);
        animation: pulseCore 2s infinite ease-out; z-index: 0;
    }
    @keyframes pulseCore { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
    
    .live-clock-badge {
        margin-top: 20px; background: rgba(0, 243, 255, 0.1); padding: 8px 20px; 
        border-radius: 30px; border: 1px solid rgba(0, 243, 255, 0.4); 
        color: #00f3ff; font-family: 'Orbitron', sans-serif; font-size: 14px;
        box-shadow: 0 0 15px rgba(0,243,255,0.2); backdrop-filter: blur(5px);
    }

    /* 5. FLOATING NODES (Cards) */
    .bento-card {
        position: absolute; 
        background: rgba(15, 23, 42, 0.4); border-radius: 20px; padding: 25px;
        border: 1px solid rgba(0, 243, 255, 0.2); border-top: 1px solid rgba(255,255,255,0.2);
        box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        transform: translate(-50%, -50%); /* Centering relative to coordinates */
        transition: box-shadow 0.3s ease, border 0.3s ease;
        display: flex; flex-direction: column; justify-content: center; z-index: 5;
    }
    
    .bento-card:hover { border-color: rgba(0, 243, 255, 0.8); box-shadow: 0 0 40px rgba(0, 243, 255, 0.2); z-index: 20; }
    .bento-bg-icon { position: absolute; right: -5px; bottom: -15px; font-size: 90px; opacity: 0.05; z-index: -1; }
    
    .stat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; color: #a5c3e0; font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 1px; }
    .stat-value { margin: 0; font-size: 38px; color: #fff; font-family: 'Poppins', sans-serif; font-weight: 700; }

    /* Percentage-based coordinates for auto-adjustment on any screen */
    .node-admissions { top: 22%; left: 25%; width: 280px; border-bottom: 4px solid rgba(179, 102, 255, 0.8); }
    .node-collection { top: 22%; left: 75%; width: 320px; border-bottom: 4px solid rgba(0, 255, 136, 0.8); }
    .node-students { top: 68%; left: 25%; width: 280px; border-bottom: 4px solid rgba(0, 243, 255, 0.8); }
    .node-alerts { top: 68%; left: 75%; width: 280px; border-bottom: 4px solid rgba(255, 0, 85, 0.8); cursor: pointer; }

    /* Node Custom Colors */
    .node-collection .stat-header i, .node-collection .stat-value { color: #00ff88; text-shadow: 0 0 20px rgba(0,255,136,0.4); }
    .node-students .stat-header i, .node-students .stat-value { color: #00f3ff; text-shadow: 0 0 20px rgba(0,243,255,0.4); }
    .node-admissions .stat-header i, .node-admissions .stat-value { color: #b366ff; text-shadow: 0 0 20px rgba(179,102,255,0.4); }
    .node-alerts .stat-header i, .node-alerts .stat-value { color: #ff0055; text-shadow: 0 0 20px rgba(255,0,85,0.4); }

    /* 6. COMMAND DOCK (Bottom Actions) */
    .action-dock {
        position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%);
        display: flex; gap: 15px; background: rgba(0, 0, 0, 0.4); padding: 12px 25px;
        border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(10px); z-index: 10;
    }
    .dock-btn {
        display: flex; align-items: center; gap: 10px; padding: 12px 20px;
        background: rgba(15, 23, 42, 0.6); border-radius: 12px; cursor: pointer;
        color: #a5c3e0; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600;
        border: 1px solid transparent; transition: 0.3s;
    }
    .dock-btn i { font-size: 18px; color: #00f3ff; }
    .dock-btn:hover { background: rgba(0, 243, 255, 0.15); border-color: #00f3ff; color: #fff; box-shadow: 0 0 15px rgba(0,243,255,0.3); transform: translateY(-3px); }
</style>

<!-- BACKGROUND -->
<div class="home-bg-3d"><div class="space-dust"></div></div>

<div class="neural-network-wrapper" id="parallaxArea">
    
    <!-- SVG ENERGY LINES -->
    <svg class="energy-lines-container">
        <!-- Lines connecting Center (50%,45%) to Nodes -->
        <line x1="50%" y1="45%" x2="25%" y2="22%" class="energy-line line-admissions" />
        <line x1="50%" y1="45%" x2="75%" y2="22%" class="energy-line line-collection" />
        <line x1="50%" y1="45%" x2="25%" y2="68%" class="energy-line" />
        <line x1="50%" y1="45%" x2="75%" y2="68%" class="energy-line line-alerts" />
    </svg>

    <!-- THE CORE -->
    <div class="core-node" id="coreNode">
        <div class="core-logo-box">
            <img src="logo.png" alt="Purix Academy">
            <div class="core-pulse"></div>
        </div>
        <div class="live-clock-badge">
            <i class="fa-solid fa-clock"></i> <span id="realtimeClock">Loading Time...</span>
        </div>
    </div>

    <!-- FLOATING SCATTERED NODES -->
    <div class="bento-card node-admissions js-parallax-node">
        <i class="fa-solid fa-user-astronaut bento-bg-icon"></i>
        <div class="stat-header"><i class="fa-solid fa-user-plus"></i> TODAY'S ADMISSIONS</div>
        <h2 class="stat-value" id="homeMonthAdmission"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
    </div>

    <div class="bento-card node-collection js-parallax-node">
        <i class="fa-solid fa-wallet bento-bg-icon"></i>
        <div class="stat-header"><i class="fa-solid fa-indian-rupee-sign"></i> TODAY'S COLLECTION</div>
        <h2 class="stat-value" id="homeTodayCollection"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
    </div>

    <div class="bento-card node-students js-parallax-node">
        <i class="fa-solid fa-users-viewfinder bento-bg-icon"></i>
        <div class="stat-header"><i class="fa-solid fa-users"></i> ACTIVE STUDENTS</div>
        <h2 class="stat-value" id="homeActiveStudents"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
    </div>

    <div class="bento-card node-alerts js-parallax-node" onclick="loadModule('alerts')">
        <i class="fa-solid fa-triangle-exclamation bento-bg-icon"></i>
        <div class="stat-header"><i class="fa-solid fa-bell"></i> OVERDUE ALERTS</div>
        <h2 class="stat-value" id="alertCount"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
    </div>

    <!-- COMMAND DOCK (Bottom Actions) -->
    <div class="action-dock">
        <div class="dock-btn" onclick="loadModule('admission')"><i class="fa-solid fa-id-card-clip"></i> Admission</div>
        <div class="dock-btn" onclick="loadModule('payment')"><i class="fa-solid fa-hand-holding-dollar"></i> Collect Fee</div>
        <div class="dock-btn" onclick="loadModule('profile')"><i class="fa-solid fa-magnifying-glass-chart"></i> Search</div>
        <div class="dock-btn" onclick="loadModule('reports')"><i class="fa-solid fa-file-invoice"></i> Reports</div>
    </div>

</div>

<script>
    (function() {
        // --- 1. MOUSE PARALLAX EFFECT (Neural Network Move) ---
        // Ye pura constellation mouse ke hisaab se hawa me tairta hua hilayega
        const wrapper = document.getElementById('parallaxArea');
        const core = document.getElementById('coreNode');
        const nodes = document.querySelectorAll('.js-parallax-node');

        wrapper.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 30; // Max 30px shift
            const y = (e.clientY / window.innerHeight - 0.5) * 30;
            
            // Core opposite direction me shift hoga
            core.style.transform = `translate(calc(-50% + ${-x*0.5}px), calc(-50% + ${-y*0.5}px))`;
            
            // Nodes mouse ki direction me float karenge
            nodes.forEach(node => {
                node.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            });
        });

        // --- 2. LOGIC SECTION (STRICTLY UNTOUCHED) ---

        // LIVE CLOCK
        function updateClock() {
            const clockElement = document.getElementById('realtimeClock');
            if (!clockElement) return; 
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            const dateString = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
            clockElement.innerText = `${dateString} | ${timeString}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // DATA CACHING & FETCH
        const CACHE_DURATION_MS = 5 * 60 * 1000; 
        function loadDashboardData() {
            const now = new Date().getTime();
            const cachedStatsString = localStorage.getItem('purix_home_stats');
            let cachedStats = null;
            if (cachedStatsString) { try { cachedStats = JSON.parse(cachedStatsString); } catch (e) {} }

            if (cachedStats && cachedStats.timestamp && (now - cachedStats.timestamp < CACHE_DURATION_MS)) {
                updateStatsUI(cachedStats.data);
            } else {
                fetch(API_URL + "?action=getStats")
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") {
                            updateStatsUI(data.data);
                            localStorage.setItem('purix_home_stats', JSON.stringify({ timestamp: now, data: data.data }));
                        }
                    });
            }

            const todayStr = new Date().toDateString();
            const cachedAlertsDate = localStorage.getItem('purix_alerts_date');
            const cachedAlertsData = localStorage.getItem('purix_alerts_data');

            if (cachedAlertsDate === todayStr && cachedAlertsData) {
                document.getElementById('alertCount').innerText = countRealOverdueAlerts(JSON.parse(cachedAlertsData));
            } else {
                fetch(API_URL + "?action=getAlerts")
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") {
                            localStorage.setItem('purix_alerts_date', todayStr);
                            localStorage.setItem('purix_alerts_data', JSON.stringify(data.data));
                            document.getElementById('alertCount').innerText = countRealOverdueAlerts(data.data);
                        }
                    });
            }
        }

        // SELF-HEALING UI
        function updateStatsUI(data) {
            if (!data) return;
            if (data.todayAdmissions === undefined && data.monthAdmission !== undefined) {
                localStorage.removeItem('purix_home_stats'); 
            }
            let active = data.activeStudents !== undefined ? data.activeStudents : 0;
            let admissions = data.todayAdmissions !== undefined ? data.todayAdmissions : (data.monthAdmission || 0);
            let collection = data.todayCollection !== undefined ? data.todayCollection : 0;

            document.getElementById('homeActiveStudents').innerText = active;
            document.getElementById('homeMonthAdmission').innerText = admissions;
            document.getElementById('homeTodayCollection').innerText = "₹" + collection;
        }

        function countRealOverdueAlerts(alertsList) {
            let criticalCount = 0;
            alertsList.forEach(student => {
                let due = new Date(student.dueDate);
                if (!isNaN(due.getTime())) {
                    due.setHours(0,0,0,0);
                    let today = new Date(); today.setHours(0,0,0,0);
                    let diff = Math.ceil((due.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
                    if (diff < 0) criticalCount++; 
                }
            });
            return criticalCount;
        }

        // AUTO SYNC
        loadDashboardData();
        setInterval(loadDashboardData, 60000); 
    })();
</script>
