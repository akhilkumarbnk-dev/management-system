<style>
/* =====================================================
   PURIX ACADEMY — FUTURISTIC HUD DASHBOARD
   Desktop-first | Existing CRM integration preserved
===================================================== */

.hud-master-container {
    --hud-blue: #00e5ff;
    --hud-blue-soft: rgba(0, 229, 255, .45);
    --hud-dark: #020b18;
    --hud-panel: rgba(2, 11, 24, .88);
    --hud-white: #eafaff;

    position: relative;
    width: 100%;
    height: calc(100vh - 10px);
    min-height: 600px;
    background: #020b18;
    overflow: hidden;
    isolation: isolate;
    color: var(--hud-white);
    font-family: 'Orbitron', 'Rajdhani', 'Arial', sans-serif;
}

/* Background grid and scanlines */
.hud-master-container::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(ellipse at 50% 45%, rgba(10, 60, 110, .55), transparent 70%),
        repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0, 150, 255, .075) 4px, transparent 5px),
        linear-gradient(135deg, #04172a, #010712 60%, #03182b);
}

.hud-master-container::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: linear-gradient(90deg, transparent 49.9%, rgba(0, 229, 255, .055) 50%, transparent 50.1%);
    opacity: .6;
}

/* =====================================================
   RESPONSIVE HUD CANVAS (WIDESCREEN FIXED)
===================================================== */
.hud-master-container .hud-scaler {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%; /* Changed to 100% for full width */
    max-width: 1600px; /* Increased max-width for widescreen */
    height: 900px;
    transform: translate(-50%, -50%) scale(.9);
    transform-origin: center center;
}

.hud-master-container .hud-scaler svg {
    display: block;
    width: 100%; /* SVG uses 100% of scaler */
    height: 900px;
    overflow: visible;
}

.hud-master-container .hud-scaler text {
    font-family: 'Orbitron', 'Rajdhani', 'Arial', sans-serif;
}

/* Corner brackets */
.hud-master-container .hud-corner {
    position: absolute;
    width: 30px;
    height: 30px;
    z-index: 15;
    pointer-events: none;
}
.hud-master-container .hud-corner.tl { top: 12px; left: 12px; border-top: 2px solid var(--hud-blue); border-left: 2px solid var(--hud-blue); }
.hud-master-container .hud-corner.tr { top: 12px; right: 12px; border-top: 2px solid var(--hud-blue); border-right: 2px solid var(--hud-blue); }
.hud-master-container .hud-corner.bl { bottom: 12px; left: 12px; border-bottom: 2px solid var(--hud-blue); border-left: 2px solid var(--hud-blue); }
.hud-master-container .hud-corner.br { bottom: 12px; right: 12px; border-bottom: 2px solid var(--hud-blue); border-right: 2px solid var(--hud-blue); }

/* Animation classes */
.hud-master-container .hx-r { animation: hxSpin linear infinite; }
.hud-master-container .hx-f { animation-direction: reverse; }
.hud-master-container .hx-pulse { animation: hxPulse 3s ease-in-out infinite; }
.hud-master-container .hx-float { animation: hxFloat 5s ease-in-out infinite; }
.hud-master-container .hx-scan { animation: hxScan 7s linear infinite; }
.hud-master-container .hx-blink { animation: hxPulse 1.2s steps(2) infinite; }
.hud-master-container .hx-march { animation: hxMarch 1.2s linear infinite; }

@keyframes hxSpin { to { transform: rotate(360deg); } }
@keyframes hxPulse { 50% { opacity: .35; } }
@keyframes hxFloat { 50% { transform: translateY(7px) rotate(2deg); } }
@keyframes hxScan { from { transform: translateY(-60px); } to { transform: translateY(960px); } }
@keyframes hxMarch { to { stroke-dashoffset: -6.3; } }

@media (prefers-reduced-motion: reduce) {
    .hud-master-container * { animation: none !important; }
}
</style>

                    if (data.status === "success" && data.data) {
                        updateStatsUI(data.data);
                        localStorage.setItem("purix_home_stats", JSON.stringify({ timestamp: Date.now(), data: data.data }));
                    }
                })
                .catch(err => console.error(err));
        }

        const todayStr = new Date().toDateString();
        const cachedAlertsDate = localStorage.getItem("purix_alerts_date");
        const cachedAlertsData = safeJSON(localStorage.getItem("purix_alerts_data"));

        if (cachedAlertsDate === todayStr && Array.isArray(cachedAlertsData)) {
            setText("alertCount", countRealOverdueAlerts(cachedAlertsData));
        } else {
            fetch(API_URL + "?action=getAlerts")
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success" && Array.isArray(data.data)) {
                        localStorage.setItem("purix_alerts_date", todayStr);
                        localStorage.setItem("purix_alerts_data", JSON.stringify(data.data));
                        setText("alertCount", countRealOverdueAlerts(data.data));
                    }
                })
                .catch(err => console.error(err));
        }
    }

    function updateStatsUI(data) {
        if (!data) return;
        if (data.todayAdmissions === undefined && data.monthAdmission !== undefined) {
            localStorage.removeItem("purix_home_stats");
        }
        setText("homeActiveStudents", data.activeStudents !== undefined ? data.activeStudents : 0);
        setText("homeMonthAdmission", data.todayAdmissions !== undefined ? data.todayAdmissions : (data.monthAdmission || 0));
        setText("homeTodayCollection", "₹" + (data.todayCollection !== undefined ? data.todayCollection : 0));
    }

    function countRealOverdueAlerts(alertsList) {
        if (!Array.isArray(alertsList)) return 0;
        let c = 0;
        const today = new Date(); today.setHours(0,0,0,0);
        alertsList.forEach(s => {
            if (!s || !s.dueDate) return;
            const due = new Date(s.dueDate);
            if (!isNaN(due.getTime())) {
                due.setHours(0,0,0,0);
                if (Math.ceil((due.getTime() - today.getTime()) / (1000 * 60 * 60 * 24)) < 0) c++;
            }
        });
        return c;
    }

    /* Adjusted Scaling Logic for new 1600x900 dimension */
    function scaleHUD() {
        const hc = document.getElementById("hudContainer"), hs = document.getElementById("hudScaler");
        if (!hc || !hs) return;
        const s = Math.min(hc.clientWidth / 1600, hc.clientHeight / 900) * 0.95;
        hs.style.transform = `translate(-50%, -50%) scale(${s})`;
    }
    window.addEventListener("resize", scaleHUD);
    requestAnimationFrame(scaleHUD);

    loadDashboardData();
    setInterval(loadDashboardData, 60000);
})();
</script>
