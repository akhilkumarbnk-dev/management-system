<style>
/* =====================================================
   PURIX ACADEMY — FUTURISTIC HUD DASHBOARD  (FINAL)
   Auto-fit: desktop / laptop / tablet = scaled 16:9 HUD
             phone / portrait = compact mobile HUD
===================================================== */

.hud-master-container {
    --hud-blue: #00e5ff;
    --hud-blue-soft: rgba(0, 229, 255, .45);
    --hud-dark: #020b18;
    --hud-panel: rgba(2, 11, 24, .88);
    --hud-white: #eafaff;

    position: relative;
    width: 100%;
    height: calc(100vh - 90px);   /* JS isse parent ki asli jagah ke hisaab se set karta hai */
    min-height: 0;
    background: #020b18;
    overflow: hidden;
    isolation: isolate;
    color: var(--hud-white);
    font-family: 'Orbitron', 'Rajdhani', 'Arial', sans-serif;
}

.hud-master-container::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(ellipse at 50% 45%, rgba(10, 60, 110, .55), transparent 70%),
        repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0, 150, 255, .075) 4px, transparent 5px),
        linear-gradient(135deg, #04172a, #010712 60%, #03182b);
}

.hud-master-container::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: linear-gradient(90deg, transparent 49.9%, rgba(0, 229, 255, .055) 50%, transparent 50.1%);
    opacity: .6;
}

/* edges par halka andhera: center par focus */
.hud-master-container .hx2-vig {
    position: absolute; inset: 0; z-index: 18; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(0, 5, 12, .62) 100%);
}

.hud-master-container .hud-scaler {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1600px;
    height: 900px;
    transform: translate(-50%, -50%);
    transform-origin: center center;
}

.hud-master-container .hud-scaler svg {
    display: block;
    width: 1600px;
    height: 900px;
    overflow: visible;
}

.hud-master-container .hud-scaler text {
    font-family: 'Orbitron', 'Rajdhani', 'Arial', sans-serif;
}

.hud-master-container .hud-corner {
    position: absolute;
    width: 30px;
    height: 30px;
    z-index: 15;
    pointer-events: none;
}
.hud-master-container .hud-corner.tl { top: 15px; left: 15px; border-top: 3px solid var(--hud-blue); border-left: 3px solid var(--hud-blue); }
.hud-master-container .hud-corner.tr { top: 15px; right: 15px; border-top: 3px solid var(--hud-blue); border-right: 3px solid var(--hud-blue); }
.hud-master-container .hud-corner.bl { bottom: 15px; left: 15px; border-bottom: 3px solid var(--hud-blue); border-left: 3px solid var(--hud-blue); }
.hud-master-container .hud-corner.br { bottom: 15px; right: 15px; border-bottom: 3px solid var(--hud-blue); border-right: 3px solid var(--hud-blue); }

.hud-master-container .hx-r { animation: hxSpin linear infinite; }
.hud-master-container .hx-f { animation-direction: reverse; }
.hud-master-container .hx-pulse { animation: hxPulse 3s ease-in-out infinite; }
.hud-master-container .hx-float { animation: hxFloat 5s ease-in-out infinite; }
.hud-master-container .hx-scan { animation: hxScan 7s linear infinite; }
.hud-master-container .hx-blink { animation: hxPulse 1.2s steps(2) infinite; }
.hud-master-container .hx-march { animation: hxMarch 1.2s linear infinite; }

@keyframes hxSpin { to { transform: rotate(360deg); } }
@keyframes hxPulse { 50% { opacity: .35; } }
@keyframes hxFloat { 50% { transform: translateY(7px) rotate(2deg); } }
@keyframes hxScan { from { transform: translateY(-60px); } to { transform: translateY(960px); } }
@keyframes hxMarch { to { stroke-dashoffset: -6.3; } }

/* 3D EARTH ROTATING LOGO */
.logo-3d-spin {
    position: absolute;
    top: 430px;
    left: 800px;
    width: 140px;
    height: 140px;
    margin-top: -70px;
    margin-left: -70px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(0, 229, 255, 0.8);
    box-shadow: 0 0 25px rgba(0, 229, 255, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.2);
    animation: spinEarth3D 7s linear infinite;
    z-index: 100;
}

@keyframes spinEarth3D {
    0% { transform: perspective(800px) rotateY(0deg); }
    100% { transform: perspective(800px) rotateY(360deg); }
}

/* ===== v2: tilt / boot / ripple / palette ===== */
.hud-master-container .hx2-tilt { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-style: preserve-3d; will-change: transform; }
.hud-master-container .hx2-tilt.assemble { animation: hx2Assemble 1.1s cubic-bezier(.2,.8,.2,1) backwards; }
@keyframes hx2Assemble { from { opacity: 0; filter: blur(10px); transform: scale(.94); } }

.hx2-boot { position: absolute; inset: 0; z-index: 60; background: #010812; display: flex; flex-direction: column; justify-content: center; padding: 0 12vw; gap: 10px; font: 600 14px 'Orbitron', monospace; color: #00e5ff; letter-spacing: 2px; transition: opacity .6s; cursor: pointer; }
.hx2-boot div { opacity: 0; transform: translateX(-8px); animation: hx2Line .35s forwards; }
.hx2-boot b { color: #00ff99; }
.hx2-boot.out { opacity: 0; pointer-events: none; }
@keyframes hx2Line { to { opacity: 1; transform: none; } }

.hx2-rip { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border: 2px solid #00e5ff; border-radius: 50%; pointer-events: none; z-index: 40; animation: hx2Rip .7s ease-out forwards; }
@keyframes hx2Rip { to { transform: scale(11); opacity: 0; } }

.hx2-hint { position: absolute; right: 18px; bottom: 14px; z-index: 30; font: 600 10px 'Orbitron', sans-serif; letter-spacing: 2px; color: #7fdcff; background: rgba(2,11,24,.8); border: 1px solid rgba(0,229,255,.4); padding: 6px 10px; border-radius: 4px; cursor: pointer; transition: .25s; }
.hx2-hint:hover { color: #fff; border-color: #00e5ff; box-shadow: 0 0 14px rgba(0,229,255,.5); }

.px-pal { position: fixed; inset: 0; z-index: 100000; background: rgba(1,6,14,.72); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: flex-start; padding-top: 16vh; animation: hx2Fade .2s; }
.px-pal-box { width: min(520px, 92vw); background: rgba(4,14,30,.96); border: 1px solid #00e5ff; border-radius: 12px; box-shadow: 0 0 40px rgba(0,229,255,.3), inset 0 0 30px rgba(0,229,255,.05); overflow: hidden; font-family: 'Poppins', sans-serif; }
.px-pal-box input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid rgba(0,229,255,.3); padding: 16px 18px; color: #e0f7fa; font-size: 16px; outline: none; }
.px-pal-item { display: flex; align-items: center; gap: 12px; padding: 12px 18px; color: #a5c3e0; cursor: pointer; font-size: 14px; }
.px-pal-item i { width: 18px; color: #00e5ff; text-align: center; }
.px-pal-item small { margin-left: auto; font-family: 'Orbitron', sans-serif; font-size: 10px; color: #647b9e; letter-spacing: 1px; }
.px-pal-item.on { background: rgba(0,229,255,.12); color: #fff; box-shadow: inset 3px 0 0 #00e5ff; }
@keyframes hx2Fade { from { opacity: 0; } }

/* ===== MOBILE / PORTRAIT HUD (JS .hx-mobile class lagata hai) ===== */
.hx-mob { display: none; position: absolute; inset: 0; z-index: 25; overflow-y: auto; padding: 16px 14px 26px; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
.hx-mobile .hud-scaler, .hx-mobile .hx2-hint { display: none; }
.hx-mobile .hx-mob { display: flex; }
.hx-mob-hero { text-align: center; padding: 6px 0 2px; }
.hx-mob-logo { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(0,229,255,.8); box-shadow: 0 0 28px rgba(0,229,255,.55), inset 0 0 18px rgba(255,255,255,.2); animation: spinEarth3D 7s linear infinite; }
.hx-mob-title { margin-top: 12px; font-weight: 900; font-size: clamp(20px, 6vw, 28px); letter-spacing: 4px; color: #fff; text-shadow: 0 0 12px #00e5ff; }
.hx-mob-sub { margin-top: 4px; font-size: 8px; letter-spacing: 3px; color: #00e5ff; opacity: .75; }
.hx-mob-live { margin-top: 8px; font-size: 9px; letter-spacing: 2px; color: #7fdcff; }
.hx-mob-live i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #00ff99; box-shadow: 0 0 8px #00ff99; margin-right: 6px; animation: hxPulse 1.6s ease-in-out infinite; }
.hx-mob-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.hx-mc { position: relative; background: rgba(2,11,24,.85); border: 1px solid rgba(0,229,255,.35); border-radius: 12px; padding: 14px 14px 12px; box-shadow: inset 0 0 22px rgba(0,229,255,.06), 0 0 16px rgba(0,229,255,.08); cursor: default; transition: .2s; min-width: 0; }
.hx-mc::before { content: ""; position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-top: 2px solid #00e5ff; border-left: 2px solid #00e5ff; border-top-left-radius: 12px; }
.hx-mc small { display: block; font-size: 8.5px; letter-spacing: 1.5px; color: #9be8ff; font-weight: 700; }
.hx-mc b { display: block; margin-top: 6px; font-size: clamp(22px, 7vw, 30px); font-weight: 800; color: #fff; text-shadow: 0 0 10px rgba(0,229,255,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hx-mc.w { grid-column: 1 / -1; }
.hx-mc.red { border-color: rgba(255,36,93,.6); box-shadow: inset 0 0 22px rgba(255,36,93,.08), 0 0 16px rgba(255,36,93,.12); }
.hx-mc.red::before { border-color: #ff245d; }
.hx-mc.red small { color: #ff9db4; }
.hx-mc.red b { text-shadow: 0 0 10px rgba(255,36,93,.8); }
.hx-mc[data-mod], .hx-mob-btns button { cursor: pointer; }
.hx-mc[data-mod]:active, .hx-mob-btns button:active { transform: scale(.97); }
.hx-bar { display: flex; height: 12px; margin-top: 10px; border-radius: 6px; overflow: hidden; background: #0a2442; gap: 2px; }
.hx-bar i { display: block; flex: 0.0001 1 0; min-width: 0; transition: flex-grow .6s ease; box-shadow: 0 0 8px currentColor; }
.hx-leg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; font-size: 8px; letter-spacing: .6px; color: #a5c3e0; text-align: center; }
.hx-leg span b { display: block; margin: 0 0 2px; font-size: 16px; text-shadow: none; }
.hx-mob-btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 10px; }
.hx-mob-btns button { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; background: radial-gradient(circle at 50% 35%, #0e4c8e, #041430 75%); border: 1px solid #2a8fe0; border-radius: 14px; color: #fff; font: 800 10px 'Orbitron', sans-serif; letter-spacing: 1px; transition: .2s; }
.hx-mob-btns button i { font-size: 20px; color: #00e5ff; text-shadow: 0 0 10px #00e5ff; }
.hx-mob-btns button:hover { border-color: #fff; box-shadow: 0 0 16px rgba(0,229,255,.5); }

@media (prefers-reduced-motion: reduce) {
    .hud-master-container * { animation: none !important; }
    .hx2-boot div, .hx2-rip { animation: none !important; }
}
</style>

<script>
(function(){
    var HC=document.getElementById('hudContainer'),NS='http://www.w3.org/2000/svg',$=function(i){return HC.querySelector('#'+i)};
    function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
    function idle(){return HC.classList.contains('hx-mobile')}

    /* top blocks on center ring */

        let cachedStats = safeJSON(cachedStatsString);
