<style>
    /* =========================================
       1. EXACT BACKGROUND & SCANLINES
    ========================================= */
    :root {
        --hud-blue: #00e5ff;
        --hud-dark: #020b18;
        --hud-panel: rgba(2, 11, 24, 0.75);
    }
    body, html { margin: 0; padding: 0; background: var(--hud-dark); overflow: hidden; font-family: 'Orbitron', sans-serif; }
    
    /* Container ab viewport ki jagah apne parent (sidebar ke bachi jagah) me fit hoga */
    .hud-master-container {
        position: relative; width: 100%; min-height: calc(100vh - 10px);
        background-color: var(--hud-dark);
        background-image: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0, 150, 255, 0.1) 3px, rgba(0, 150, 255, 0.1) 4px);
        overflow: hidden; z-index: 1;
    }

    /* AUTO-SCALE WRAPPER: Ye box apne aap chhota-bada hoga */
    .hud-scaler {
        width: 1280px; height: 720px; 
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        transform-origin: center center;
    }

    /* TOP HUD TEXT & SATELLITE */
    .top-hud-header {
        position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: flex-end; gap: 15px; z-index: 10;
    }
    .top-hud-header h1 {
        margin: 0; padding: 5px 30px; font-size: 32px; color: #fff;
        background: rgba(0, 0, 0, 0.5); border: 2px solid var(--hud-blue);
        border-top: none; clip-path: polygon(0 0, 100% 0, 90% 100%, 10% 100%);
        text-shadow: 0 0 10px var(--hud-blue); letter-spacing: 5px;
    }

    /* =========================================
       2. EXTREME DETAIL CENTER REACTOR
    ========================================= */
    .center-reactor {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 650px; height: 650px; background: radial-gradient(circle, #020a17 40%, #000 70%);
        border-radius: 50%; display: flex; justify-content: center; align-items: center;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.8); z-index: 5;
    }

    .reactor-ring { position: absolute; border-radius: 50%; border: 1px solid transparent; display: flex; justify-content: center; align-items: center; }
    
    .ring-1-outer { width: 620px; height: 620px; border: 1px dashed rgba(0, 229, 255, 0.3); animation: spinRight 120s linear infinite; }
    .ring-2-binary { width: 590px; height: 590px; font-size: 8px; color: rgba(0,229,255,0.4); text-transform: uppercase; letter-spacing: 2px; animation: spinLeft 150s linear infinite; }
    
    .ring-3-ticks {
        width: 530px; height: 530px; border-radius: 50%;
        background: conic-gradient(from 0deg, var(--hud-blue) 0 1deg, transparent 1deg 3deg);
        -webkit-mask-image: radial-gradient(transparent 68%, black 70%);
        animation: spinRight 40s linear infinite; opacity: 0.8;
    }

    .ring-4-thick {
        width: 480px; height: 480px; border: 15px solid rgba(0, 229, 255, 0.1);
        border-top-color: rgba(0, 229, 255, 0.8); border-bottom-color: rgba(0, 229, 255, 0.8);
        animation: spinLeft 25s linear infinite;
    }

    .ring-5-inner-dashed {
        width: 420px; height: 420px; border: 4px dashed var(--hud-blue); opacity: 0.6;
        animation: spinRight 20s linear infinite;
    }

    .ring-6-core {
        width: 330px; height: 330px; border: 2px solid var(--hud-blue);
        box-shadow: 0 0 30px rgba(0, 229, 255, 0.4), inset 0 0 30px rgba(0, 229, 255, 0.4);
        background: radial-gradient(circle, rgba(0,229,255,0.1) 0%, transparent 70%);
    }

    .core-logo {
        width: 150px; height: 150px; border-radius: 50%; z-index: 10;
        border: 2px solid #fff; box-shadow: 0 0 40px var(--hud-blue);
        object-fit: cover; background: #000;
    }

    .ring-2-binary::before { content: "0100 01111 0100 0011 1110 0101 1000 0000 0101 1110 0100 0001"; position: absolute; top: -10px; }
    .ring-2-binary::after { content: "1110 0100 0011 1110 0101 1000 0000 0101 1110 0100 0001 0100"; position: absolute; bottom: -10px; }

    @keyframes spinRight { 100% { transform: rotate(360deg); } }
    @keyframes spinLeft { 100% { transform: rotate(-360deg); } }

    /* =========================================
       3. TOP LEFT & RIGHT WIDGETS
    ========================================= */
    .top-left-radar {
        position: absolute; top: 30px; left: 30px; width: 220px; height: 220px;
        background: var(--hud-panel); border: 1px solid var(--hud-blue);
        display: flex; justify-content: center; align-items: center; z-index: 5;
    }
    .top-left-radar::before {
        content: ''; position: absolute; width: 180px; height: 180px; border-radius: 50%;
        border: 4px solid rgba(0,229,255,0.3); border-top-color: var(--hud-blue);
        animation: spinRight 5s linear infinite;
    }
    .top-left-radar::after {
        content: ''; position: absolute; width: 140px; height: 140px; border-radius: 50%;
        border: 2px dashed var(--hud-blue); animation: spinLeft 10s linear infinite;
    }
    
    .top-right-globe {
        position: absolute; top: 30px; right: 30px; width: 250px; height: 250px;
        display: flex; flex-direction: column; justify-content: space-between; align-items: center; z-index: 5;
    }
    .globe-sphere {
        width: 180px; height: 180px; border-radius: 50%; border: 1px solid rgba(0,229,255,0.2);
        background: repeating-linear-gradient(0deg, transparent, transparent 15px, rgba(0,229,255,0.3) 16px),
                    repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(0,229,255,0.3) 16px);
        background-size: 100% 100%; border-radius: 50%;
        box-shadow: inset 0 0 40px rgba(0,229,255,0.6);
    }
    .globe-chart { width: 100%; height: 40px; display: flex; align-items: flex-end; gap: 2px; }
    .globe-chart div { flex: 1; background: var(--hud-blue); opacity: 0.7; animation: chartPulse 1s infinite alternate; }
    @keyframes chartPulse { 0% { height: 20%; } 100% { height: 100%; } }

    /* =========================================
       4. EXACT SIDE CARDS (Real Names)
    ========================================= */
    .side-cards-container {
        position: absolute; top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; gap: 40px; z-index: 10;
    }
    .left-cards { left: 30px; }
    .right-cards { right: 30px; }

    .hud-block {
        width: 270px; height: 110px; position: relative;
        background: var(--hud-panel); border: 1px solid var(--hud-blue);
        display: flex; flex-direction: column; justify-content: center; padding: 0 20px;
        clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
        box-shadow: inset 0 0 15px rgba(0,229,255,0.2);
    }
    .hud-block::before {
        content: ''; position: absolute; left: -10px; top: 10%; width: 5px; height: 80%;
        border-left: 2px solid var(--hud-blue); border-top: 2px solid var(--hud-blue); border-bottom: 2px solid var(--hud-blue);
    }
    .hud-block::after {
        content: ''; position: absolute; right: -10px; top: 10%; width: 5px; height: 80%;
        border-right: 2px solid var(--hud-blue); border-top: 2px solid var(--hud-blue); border-bottom: 2px solid var(--hud-blue);
    }
    
    .block-title {
        font-size: 11px; color: #fff; letter-spacing: 1px; margin-bottom: 5px; text-align: right;
        border-bottom: 1px solid rgba(0,229,255,0.4); padding-bottom: 3px; display: flex; justify-content: space-between;
    }
    .block-value { font-size: 28px; color: var(--hud-blue); font-weight: bold; text-shadow: 0 0 10px var(--hud-blue); display: flex; align-items: center; gap: 10px; }
    .mini-eq { display: flex; gap: 2px; height: 15px; margin-top: 5px; }
    .mini-eq span { flex: 1; background: var(--hud-blue); animation: chartPulse 0.5s infinite alternate; }
    
    .hud-block.alert-block .block-title { color: #ff0055; border-color: #ff0055; }
    .hud-block.alert-block .block-value { color: #ff0055; text-shadow: 0 0 10px #ff0055; }
    .hud-block.alert-block .mini-eq span { background: #ff0055; }

    /* =========================================
       5. BOTTOM CIRCULAR ACTION BUTTONS
    ========================================= */
    .bottom-circles-container {
        position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 50px; align-items: center; z-index: 10;
    }
    .circle-btn {
        width: 90px; height: 90px; border-radius: 50%;
        background: var(--hud-panel); border: 2px solid rgba(0, 229, 255, 0.4);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        position: relative; cursor: pointer; transition: 0.3s;
        box-shadow: inset 0 0 15px rgba(0,229,255,0.2);
    }
    .circle-btn i { font-size: 24px; color: #fff; margin-bottom: 3px; z-index: 2; }
    .circle-btn span { font-size: 9px; color: var(--hud-blue); font-weight: bold; letter-spacing: 1px; text-transform: uppercase; z-index: 2; }
    
    .circle-btn::before {
        content: ''; position: absolute; width: 110px; height: 110px; border-radius: 50%;
        border: 2px solid transparent; border-top-color: var(--hud-blue); border-bottom-color: var(--hud-blue);
        animation: spinRight 8s linear infinite;
    }
    .circle-btn::after {
        content: ''; position: absolute; width: 75px; height: 75px; border-radius: 50%;
        border: 1px dashed var(--hud-blue); animation: spinLeft 6s linear infinite;
    }
    .circle-btn:hover { background: rgba(0, 229, 255, 0.2); border-color: var(--hud-blue); box-shadow: 0 0 20px var(--hud-blue); transform: scale(1.05); }

    .bottom-dec {
        position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
        width: 300px; height: 20px; border-top: 2px solid var(--hud-blue);
        border-left: 2px solid var(--hud-blue); border-right: 2px solid var(--hud-blue);
    }
    .bottom-dec::before { content: '1010 0100 0011 0000 1111 0000'; position: absolute; top: -15px; left: 10px; font-size: 8px; color: var(--hud-blue); }

</style>

<div class="hud-master-container" id="hudContainer">
    
    <!-- YAHAN SE AUTO-SCALE ENGINE START HOTA HAI -->
    <div class="hud-scaler" id="hudScaler">

        <!-- TOP HEADER -->
        <div class="top-hud-header">
            <!-- Cycle icon replaced with real Satellite icon -->
            <i class="fa-solid fa-satellite" style="font-size: 40px; color: var(--hud-blue); filter: drop-shadow(0 0 10px var(--hud-blue));"></i>
            <h1>HUD</h1>
        </div>

        <!-- TOP LEFT RADAR -->
        <div class="top-left-radar">
            <div style="width:50px; height:50px; background:var(--hud-blue); border-radius:50%; box-shadow:0 0 20px var(--hud-blue);"></div>
        </div>

        <!-- TOP RIGHT GLOBE -->
        <div class="top-right-globe">
            <div class="globe-sphere"></div>
            <div class="globe-chart">
                <div style="animation-delay:0.1s"></div><div style="animation-delay:0.3s"></div>
                <div style="animation-delay:0.5s"></div><div style="animation-delay:0.2s"></div>
                <div style="animation-delay:0.6s"></div><div style="animation-delay:0.4s"></div>
                <div style="animation-delay:0.1s"></div><div style="animation-delay:0.7s"></div>
            </div>
        </div>

        <!-- LEFT CARDS (Real Names) -->
        <div class="side-cards-container left-cards">
            <div class="hud-block">
                <div class="block-title"><span><i class="fa-solid fa-user-plus"></i></span> TODAY'S ADMISSIONS</div>
                <div class="block-value" id="homeMonthAdmission"><i class="fa-solid fa-spinner fa-spin"></i></div>
                <div class="mini-eq"><span style="animation-delay:0.1s"></span><span style="animation-delay:0.4s"></span><span style="animation-delay:0.2s"></span><span style="animation-delay:0.6s"></span></div>
            </div>
            <div class="hud-block">
                <div class="block-title"><span><i class="fa-solid fa-users"></i></span> ACTIVE STUDENTS</div>
                <div class="block-value" id="homeActiveStudents"><i class="fa-solid fa-spinner fa-spin"></i></div>
                <div class="mini-eq"><span style="animation-delay:0.5s"></span><span style="animation-delay:0.2s"></span><span style="animation-delay:0.8s"></span><span style="animation-delay:0.1s"></span></div>
            </div>
        </div>

        <!-- CENTER MASSIVE REACTOR & LOGO -->
        <div class="center-reactor">
            <div class="reactor-ring ring-1-outer"></div>
            <div class="reactor-ring ring-2-binary"></div>
            <div class="reactor-ring ring-3-ticks"></div>
            <div class="reactor-ring ring-4-thick"></div>
            <div class="reactor-ring ring-5-inner-dashed"></div>
            <div class="reactor-ring ring-6-core"></div>
            
            <img src="logo.png" class="core-logo" alt="Purix Core">
        </div>

        <!-- RIGHT CARDS (Real Names) -->
        <div class="side-cards-container right-cards">
            <div class="hud-block">
                <div class="block-title"><span><i class="fa-solid fa-wallet"></i></span> TODAY'S COLLECTION</div>
                <div class="block-value" id="homeTodayCollection"><i class="fa-solid fa-spinner fa-spin"></i></div>
                <div class="mini-eq"><span style="animation-delay:0.3s"></span><span style="animation-delay:0.7s"></span><span style="animation-delay:0.1s"></span><span style="animation-delay:0.5s"></span></div>
            </div>
            <div class="hud-block alert-block" onclick="loadModule('alerts')" style="cursor:pointer;">
                <div class="block-title"><span><i class="fa-solid fa-triangle-exclamation"></i></span> OVERDUE ALERTS</div>
                <div class="block-value" id="alertCount"><i class="fa-solid fa-spinner fa-spin"></i></div>
                <div class="mini-eq"><span style="animation-delay:0.2s"></span><span style="animation-delay:0.6s"></span><span style="animation-delay:0.3s"></span><span style="animation-delay:0.8s"></span></div>
            </div>
        </div>

        <!-- BOTTOM CIRCULAR BUTTONS -->
        <div class="bottom-circles-container">
            <div class="circle-btn" onclick="loadModule('admission')">
                <i class="fa-solid fa-id-card-clip"></i><span>Admit</span>
            </div>
            <div class="circle-btn" onclick="loadModule('payment')">
                <i class="fa-solid fa-hand-holding-dollar"></i><span>Fee</span>
            </div>
            <div class="circle-btn" onclick="loadModule('profile')">
                <i class="fa-solid fa-magnifying-glass-chart"></i><span>Search</span>
            </div>
            <div class="circle-btn" onclick="loadModule('reports')">
                <i class="fa-solid fa-file-invoice"></i><span>Reports</span>
            </div>
        </div>

        <div class="bottom-dec"></div>
        
    </div> <!-- SCALER END -->
</div>

<script>
    (function() {
        // --- 1. HUD AUTO-SCALE ENGINE (Naya Jadoo) ---
        // Ye function screen ka size napkar poore HUD ko perfectly fit kar dega
        function scaleHUD() {
            const container = document.getElementById('hudContainer');
            const scaler = document.getElementById('hudScaler');
            if (!container || !scaler) return;
            
            const cw = container.clientWidth;
            const ch = container.clientHeight || window.innerHeight;
            
            // 1280x720 base size ke hisaab se ratio nikalega
            const scaleX = cw / 1280;
            const scaleY = ch / 720;
            // Jo bhi sabse chhota hoga us hisaab se scale karega (0.95 taaki halka sa gap rahe aur cut na ho)
            const scale = Math.min(scaleX, scaleY) * 0.95; 
            
            scaler.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }
        
        // Jab bhi screen resize hogi, ye khud fit ho jayega
        window.addEventListener('resize', scaleHUD);
        scaleHUD(); // Pehli baar load hone par bhi chalega

        // --- 2. DATA CACHING & FETCH LOGIC ---
        const CACHE_DURATION_MS = 5 * 60 * 1000; 

        function loadDashboardData() {
            const now = new Date().getTime();
            const cachedStatsString = localStorage.getItem('purix_home_stats');
            let cachedStats = null;
            if (cachedStatsString) { try { cachedStats = JSON.parse(cachedStatsString); } catch (e) {} }

            if (cachedStats && cachedStats.timestamp && (now - cachedStats.timestamp < CACHE_DURATION_MS)) {
                updateStatsUI(cachedStats.data);
            } else {
                fetch(API_URL + "?action=getStats")
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") {
                            updateStatsUI(data.data);
                            localStorage.setItem('purix_home_stats', JSON.stringify({ timestamp: now, data: data.data }));
                        }
                    });
            }

            const todayStr = new Date().toDateString();
            const cachedAlertsDate = localStorage.getItem('purix_alerts_date');
            const cachedAlertsData = localStorage.getItem('purix_alerts_data');

            if (cachedAlertsDate === todayStr && cachedAlertsData) {
                document.getElementById('alertCount').innerText = countRealOverdueAlerts(JSON.parse(cachedAlertsData));
            } else {
                fetch(API_URL + "?action=getAlerts")
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") {
                            localStorage.setItem('purix_alerts_date', todayStr);
                            localStorage.setItem('purix_alerts_data', JSON.stringify(data.data));
                            document.getElementById('alertCount').innerText = countRealOverdueAlerts(data.data);
                        }
                    });
            }
        }

        // --- 3. BULLETPROOF SELF-HEALING UI UPDATE ---
        function updateStatsUI(data) {
            if (!data) return;
            if (data.todayAdmissions === undefined && data.monthAdmission !== undefined) {
                localStorage.removeItem('purix_home_stats'); 
            }
            let active = data.activeStudents !== undefined ? data.activeStudents : 0;
            let admissions = data.todayAdmissions !== undefined ? data.todayAdmissions : (data.monthAdmission || 0);
            let collection = data.todayCollection !== undefined ? data.todayCollection : 0;

            document.getElementById('homeActiveStudents').innerText = active;
            document.getElementById('homeMonthAdmission').innerText = admissions;
            document.getElementById('homeTodayCollection').innerText = "₹" + collection;
        }

        function countRealOverdueAlerts(alertsList) {
            let criticalCount = 0;
            alertsList.forEach(student => {
                let due = new Date(student.dueDate);
                if (!isNaN(due.getTime())) {
                    due.setHours(0,0,0,0);
                    let today = new Date(); today.setHours(0,0,0,0);
                    let diff = Math.ceil((due.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
                    if (diff < 0) criticalCount++; 
                }
            });
            return criticalCount;
        }

        loadDashboardData();
        setInterval(loadDashboardData, 60000); 
    })();
</script>
