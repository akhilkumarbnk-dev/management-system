<style>
    .home-wrapper { display: flex; flex-direction: column; gap: 25px; padding: 20px; animation: fadeIn 0.5s ease-in-out; }

    /* Premium Glassmorphic Welcome Banner */
    .welcome-banner {
        background: linear-gradient(135deg, rgba(11, 16, 33, 0.9) 0%, rgba(18, 25, 43, 0.9) 100%);
        border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 20px; padding: 35px 40px;
        display: flex; align-items: center; gap: 30px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 243, 255, 0.05);
        color: #fff; position: relative; overflow: hidden; backdrop-filter: blur(10px);
    }
    .welcome-banner::before {
        content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background: radial-gradient(circle, rgba(0,243,255,0.05) 0%, transparent 60%);
        z-index: 0; animation: rotateGlow 15s linear infinite;
    }
    @keyframes rotateGlow { 100% { transform: rotate(360deg); } }

    /* Logo Design */
    .banner-logo {
        width: 90px; height: 90px; border-radius: 50%; z-index: 1;
        border: 2px solid #00f3ff; box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
        padding: 4px; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
    }
    .banner-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    .welcome-text { z-index: 1; }
    .welcome-text h1 { margin: 0 0 8px 0; font-size: 32px; color: #fff; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; text-shadow: 0 0 15px rgba(0, 243, 255, 0.5); }
    .welcome-text p { margin: 0; font-size: 15px; color: #a5c3e0; font-family: 'Poppins', sans-serif; letter-spacing: 1px; }

    /* Clean Modern Stat Cards */
    .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
    
    .stat-card {
        background: rgba(11, 16, 33, 0.7); padding: 25px 30px; border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        display: flex; align-items: center; gap: 25px; transition: 0.4s ease; position: relative; overflow: hidden;
        backdrop-filter: blur(8px);
    }
    .stat-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.3); }
    
    .stat-card::after { content: ''; position: absolute; right: -20px; bottom: -20px; font-size: 120px; opacity: 0.03; font-family: "Font Awesome 6 Free"; font-weight: 900; transition: 0.4s; }
    .stat-card:hover::after { transform: scale(1.1) rotate(-10deg); opacity: 0.06; }

    .icon-box { 
        width: 65px; height: 65px; border-radius: 14px; display: flex; align-items: center; justify-content: center; 
        font-size: 28px; z-index: 1; box-shadow: inset 0 0 15px rgba(255,255,255,0.1);
    }
    
    /* Individual Card Styling */
    .card-students { border-bottom: 4px solid #00f3ff; }
    .card-students .icon-box { background: rgba(0, 243, 255, 0.1); color: #00f3ff; border: 1px solid rgba(0,243,255,0.3); }
    .card-students::after { content: '\f0c0'; color: #00f3ff; } /* users icon */
    .card-students:hover { box-shadow: 0 10px 30px rgba(0, 243, 255, 0.15); }

    .card-admission { border-bottom: 4px solid #b366ff; }
    .card-admission .icon-box { background: rgba(179, 102, 255, 0.1); color: #b366ff; border: 1px solid rgba(179,102,255,0.3); }
    .card-admission::after { content: '\f234'; color: #b366ff; } /* user-plus icon */
    .card-admission:hover { box-shadow: 0 10px 30px rgba(179, 102, 255, 0.15); }

    .card-collection { border-bottom: 4px solid #00ff88; }
    .card-collection .icon-box { background: rgba(0, 255, 136, 0.1); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
    .card-collection::after { content: '\f156'; color: #00ff88; } /* rupee icon */
    .card-collection:hover { box-shadow: 0 10px 30px rgba(0, 255, 136, 0.15); }

    .stat-details { z-index: 1; }
    .stat-details h4 { margin: 0 0 8px 0; font-size: 13px; color: #a5c3e0; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; font-weight: 600; text-transform: uppercase; }
    .stat-details h2 { margin: 0; font-size: 28px; color: #fff; font-family: 'Poppins', sans-serif; font-weight: 700; }

    /* Quick Action Matrix */
    .quick-actions-section { 
        background: rgba(11, 16, 33, 0.6); padding: 30px; border-radius: 20px; 
        border: 1px solid rgba(255, 255, 255, 0.05); margin-top: 10px;
    }
    .quick-actions-section h3 { margin: 0 0 25px 0; color: #fff; font-size: 18px; font-family: 'Orbitron', sans-serif; display: flex; align-items: center; gap: 10px; }
    .quick-actions-section h3 i { color: #00f3ff; }
    
    .actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
    .action-btn { 
        background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 243, 255, 0.2); padding: 20px; 
        border-radius: 12px; text-align: center; cursor: pointer; transition: 0.3s; 
        display: flex; flex-direction: column; align-items: center; gap: 12px; 
        font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; color: #a5c3e0; 
    }
    .action-btn i { font-size: 26px; color: #00f3ff; transition: 0.3s; }
    .action-btn:hover { 
        background: rgba(0, 243, 255, 0.05); border-color: #00f3ff; color: #fff; 
        transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,243,255,0.1); 
    }
    .action-btn:hover i { transform: scale(1.1); text-shadow: 0 0 15px #00f3ff; }

    /* Smart Floating Alert */
    .home-floating-alert { 
        position: absolute; top: 15px; right: 15px; background: rgba(255, 0, 85, 0.15); 
        color: #ff0055; padding: 8px 20px; border-radius: 8px; border: 1px solid #ff0055; 
        font-size: 13px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(255, 0, 85, 0.3); 
        animation: pulseAlert 2s infinite; z-index: 10; display: none; align-items: center; gap: 10px; 
        font-family: 'Orbitron', sans-serif; letter-spacing: 1px; transition: 0.3s; backdrop-filter: blur(5px);
    }
    .home-floating-alert:hover { background: #ff0055; color: #fff; box-shadow: 0 0 30px rgba(255, 0, 85, 0.6); }
    @keyframes pulseAlert { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.5); } 70% { box-shadow: 0 0 0 10px rgba(255, 0, 85, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); } }
</style>

<div class="home-wrapper">
    <!-- Floating Cyber Alert (Hidden by default, shows only if dues exist) -->
    <div id="home-side-alert" class="home-floating-alert" onclick="loadModule('alerts')">
        <i class="fa-solid fa-triangle-exclamation"></i> <span id="alertCount">0</span> OVERDUE ALERTS
    </div>

    <!-- Premium Header Banner -->
    <div class="welcome-banner">
        <div class="banner-logo">
            <img src="logo.png" alt="Purix Academy Logo">
        </div>
        <div class="welcome-text">
            <h1>Purix Academy</h1>
            <p>Advanced Academic & Financial Management System</p>
        </div>
    </div>

    <!-- Clean Stat Cards -->
    <div class="stats-container">
        <div class="stat-card card-students">
            <div class="icon-box"><i class="fa-solid fa-users"></i></div>
            <div class="stat-details">
                <h4>ACTIVE STUDENTS</h4>
                <h2 id="homeActiveStudents"><i class="fa-solid fa-spinner fa-spin" style="font-size: 18px;"></i></h2>
            </div>
        </div>
        
        <div class="stat-card card-admission">
            <div class="icon-box"><i class="fa-solid fa-user-plus"></i></div>
            <div class="stat-details">
                <h4>TODAY'S ADMISSIONS</h4>
                <h2 id="homeMonthAdmission"><i class="fa-solid fa-spinner fa-spin" style="font-size: 18px;"></i></h2>
            </div>
        </div>

        <div class="stat-card card-collection">
            <div class="icon-box"><i class="fa-solid fa-wallet"></i></div>
            <div class="stat-details">
                <h4>TODAY'S COLLECTION</h4>
                <h2 id="homeTodayCollection"><i class="fa-solid fa-spinner fa-spin" style="font-size: 18px;"></i></h2>
            </div>
        </div>
    </div>

    <!-- Quick Action Matrix -->
    <div class="quick-actions-section">
        <h3><i class="fa-solid fa-layer-group"></i> Quick Actions</h3>
        <div class="actions-grid">
            <div class="action-btn" onclick="loadModule('admission')">
                <i class="fa-solid fa-id-card-clip"></i>
                <span>New Admission</span>
            </div>
            <div class="action-btn" onclick="loadModule('payment')">
                <i class="fa-solid fa-hand-holding-dollar"></i>
                <span>Collect Fee</span>
            </div>
            <div class="action-btn" onclick="loadModule('profile')">
                <i class="fa-solid fa-magnifying-glass-chart"></i>
                <span>Search Profile</span>
            </div>
            <div class="action-btn" onclick="loadModule('reports')">
                <i class="fa-solid fa-file-invoice"></i>
                <span>View Reports</span>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // 1. Fetch Core Dashboard Stats Independently (Bulletproof method)
        fetch(API_URL + "?action=getStats")
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    document.getElementById('homeActiveStudents').innerText = data.data.activeStudents;
                    document.getElementById('homeMonthAdmission').innerText = data.data.todayAdmissions;
                    document.getElementById('homeTodayCollection').innerText = "₹" + data.data.todayCollection;
                }
            })
            .catch(e => console.log("Stats fetch error:", e));

        // 2. Smart Alerts Fetch (Using Local Storage Cache to prevent lag & double loads)
        const todayStr = new Date().toDateString();
        const cachedDate = localStorage.getItem('purix_alerts_date');
        const cachedData = localStorage.getItem('purix_alerts_data');

        function countRealOverdueAlerts(alertsList) {
            let criticalCount = 0;
            alertsList.forEach(student => {
                let due = new Date(student.dueDate);
                if (!isNaN(due.getTime())) {
                    due.setHours(0,0,0,0);
                    let today = new Date(); today.setHours(0,0,0,0);
                    let diff = Math.ceil((due.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
                    if (diff < 0) criticalCount++; // Sirf fase hue (overdue) paise ginega
                }
            });
            return criticalCount;
        }

        function updateAlertUI(count) {
            if (count > 0) {
                document.getElementById('alertCount').innerText = count;
                document.getElementById('home-side-alert').style.display = 'flex';
            } else {
                document.getElementById('home-side-alert').style.display = 'none';
            }
        }

        if (cachedDate === todayStr && cachedData) {
            // Already fetched today, load from fast memory
            updateAlertUI(countRealOverdueAlerts(JSON.parse(cachedData)));
        } else {
            // Fetch fresh from Google Sheets
            fetch(API_URL + "?action=getAlerts")
                .then(res => res.json())
                .then(data => {
                    if(data.status === "success") {
                        localStorage.setItem('purix_alerts_date', todayStr);
                        localStorage.setItem('purix_alerts_data', JSON.stringify(data.data));
                        updateAlertUI(countRealOverdueAlerts(data.data));
                    }
                })
                .catch(e => console.log("Alert fetching silent fail", e));
        }
    })();
</script>
