<style>
    /* 1. CINEMATIC DEEP SPACE & FLOATING DUST BACKGROUND */
    .home-bg-3d {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: radial-gradient(circle at bottom right, #0a0f1d 0%, #020307 100%);
        z-index: -1; overflow: hidden;
    }

    /* Soft Glowing Nebulas */
    .nebula { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.5; animation: breathe 10s infinite alternate ease-in-out; }
    .nebula-1 { top: -20%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(0, 243, 255, 0.12) 0%, transparent 70%); }
    .nebula-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(179, 102, 255, 0.1) 0%, transparent 70%); animation-delay: -5s; }
    @keyframes breathe { 0% { transform: scale(1); opacity: 0.3; } 100% { transform: scale(1.1); opacity: 0.7; } }

    /* Cinematic Floating Dust / Stars */
    .space-dust {
        position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background-repeat: repeat; pointer-events: none;
    }
    /* Distant clear dust particles */
    .dust-layer-1 {
        background-image: 
            radial-gradient(2px 2px at 40px 60px, rgba(255,255,255,0.8), transparent),
            radial-gradient(2px 2px at 150px 180px, rgba(0,243,255,0.6), transparent),
            radial-gradient(3px 3px at 250px 90px, rgba(179,102,255,0.5), transparent),
            radial-gradient(1px 1px at 320px 220px, rgba(255,255,255,0.4), transparent);
        background-size: 350px 350px;
        animation: floatDust1 120s linear infinite;
        opacity: 0.7;
    }
    /* Closer out-of-focus dust particles (Bokeh effect) */
    .dust-layer-2 {
        background-image: 
            radial-gradient(4px 4px at 80px 120px, rgba(255,255,255,0.3), transparent),
            radial-gradient(5px 5px at 200px 300px, rgba(0,243,255,0.2), transparent),
            radial-gradient(6px 6px at 350px 50px, rgba(255,255,255,0.1), transparent);
        background-size: 450px 450px;
        filter: blur(3px); 
        animation: floatDust2 80s linear infinite;
        opacity: 0.9;
    }

    @keyframes floatDust1 { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-350px) rotate(3deg); } }
    @keyframes floatDust2 { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-450px) rotate(-3deg); } }

    /* MASTER WRAPPER */
    .home-master-center {
        display: flex; align-items: center; justify-content: center;
        min-height: calc(100vh - 80px); padding: 20px; z-index: 1; position: relative;
    }

    /* BENTO GRID SYSTEM */
    .bento-dashboard {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px;
        width: 100%; max-width: 1200px;
        perspective: 1500px; /* 3D Perspective */
    }

    /* 2. LIQUID GLASS 3D CARDS STYLING */
    .bento-card, .action-btn {
        background: rgba(15, 23, 42, 0.35); 
        border-radius: 20px; 
        border: 1px solid rgba(0, 243, 255, 0.15); 
        border-top: 1px solid rgba(255, 255, 255, 0.25); 
        border-left: 1px solid rgba(255, 255, 255, 0.1); 
        box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 20px rgba(0, 243, 255, 0.05);
        position: relative; 
        backdrop-filter: blur(16px); 
        -webkit-backdrop-filter: blur(16px);
        transform-style: preserve-3d; 
        transition: transform 0.1s ease-out, box-shadow 0.3s ease, background 0.3s ease; 
        will-change: transform;
    }
    
    .bento-card { padding: 30px; display: flex; flex-direction: column; justify-content: center; }
    
    /* Pop-out Effect */
    .bento-card > *, .action-btn > * {
        transform: translateZ(45px); 
        transition: transform 0.3s ease;
        pointer-events: none; 
    }

    /* Glowing borders on hover */
    .bento-card:hover, .action-btn:hover {
        border-color: rgba(0, 243, 255, 0.7);
        background: rgba(15, 23, 42, 0.45);
        box-shadow: 0 20px 50px rgba(0, 243, 255, 0.2), inset 0 0 30px rgba(0, 243, 255, 0.1);
    }

    /* Large Watermark Icons */
    .bento-bg-icon {
        position: absolute; right: -10px; bottom: -20px; font-size: 140px; 
        opacity: 0.04; transform: translateZ(10px); 
    }

    /* Specific Grid Placements */
    .welcome-bento {
        grid-column: span 2; 
        background: linear-gradient(135deg, rgba(0, 243, 255, 0.15), rgba(15, 23, 42, 0.3));
        display: flex; flex-direction: row; align-items: center; gap: 30px; justify-content: flex-start;
    }
    
    /* Neon Base Lines */
    .collection-bento { border-bottom: 5px solid rgba(0, 255, 136, 0.8); }
    .students-bento { border-bottom: 5px solid rgba(0, 243, 255, 0.8); }
    .admissions-bento { border-bottom: 5px solid rgba(179, 102, 255, 0.8); }
    .alert-bento { border-bottom: 5px solid rgba(255, 0, 85, 0.8); cursor: pointer; }

    /* Logo & Text Styling */
    .bento-logo {
        width: 110px; height: 110px; border-radius: 50%; border: 2px solid #00f3ff;
        box-shadow: 0 0 30px rgba(0, 243, 255, 0.5); padding: 5px; background: rgba(0,0,0,0.6);
        object-fit: cover; transform: translateZ(60px); 
    }
    .welcome-info h1 { margin: 0 0 5px 0; font-size: 34px; color: #fff; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; text-shadow: 0 0 15px rgba(0, 243, 255, 0.8); }
    .welcome-info p { margin: 0; color: #a5c3e0; font-size: 15px; font-family: 'Poppins', sans-serif; letter-spacing: 1px; }
    
    /* Live Clock */
    .live-clock-badge {
        display: inline-flex; align-items: center; gap: 8px; margin-top: 15px;
        background: rgba(0, 243, 255, 0.1); padding: 6px 18px; border-radius: 20px;
        border: 1px solid rgba(0, 243, 255, 0.3); color: #00f3ff; font-family: 'Orbitron', sans-serif; font-size: 13px;
        box-shadow: 0 0 15px rgba(0,243,255,0.2);
    }

    /* Stat Details */
    .stat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; color: #a5c3e0; font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 1px; }
    .stat-header i { font-size: 18px; }
    .stat-value { margin: 0; font-size: 42px; color: #fff; font-family: 'Poppins', sans-serif; font-weight: 700; }
    
    /* Color coding */
    .collection-bento .stat-header i, .collection-bento .stat-value { color: #00ff88; text-shadow: 0 0 20px rgba(0,255,136,0.5); }
    .students-bento .stat-header i, .students-bento .stat-value { color: #00f3ff; text-shadow: 0 0 20px rgba(0,243,255,0.5); }
    .admissions-bento .stat-header i, .admissions-bento .stat-value { color: #b366ff; text-shadow: 0 0 20px rgba(179,102,255,0.5); }
    .alert-bento .stat-header i, .alert-bento .stat-value { color: #ff0055; text-shadow: 0 0 20px rgba(255,0,85,0.5); }
    
    .alert-bento:hover { background: rgba(255, 0, 85, 0.15); border-color: #ff0055; box-shadow: 0 10px 40px rgba(255, 0, 85, 0.4); }

    /* Actions Matrix (Bottom Row) */
    .actions-bento {
        grid-column: span 3; display: flex; gap: 25px; padding: 10px 0;
        background: transparent; border: none; box-shadow: none; justify-content: space-between;
        backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    .action-btn {
        flex: 1; padding: 25px 20px; text-align: center; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 15px;
        color: #a5c3e0; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 600;
        border-bottom: 3px solid rgba(0,243,255,0.4);
    }
    .action-btn i { font-size: 34px; color: #00f3ff; text-shadow: 0 0 10px rgba(0,243,255,0.4); }

    /* Responsive */
    @media (max-width: 992px) { .bento-dashboard { grid-template-columns: 1fr 1fr; } .welcome-bento, .collection-bento, .actions-bento { grid-column: span 2; } .actions-bento { flex-wrap: wrap; } .action-btn { min-width: 200px; } }
    @media (max-width: 768px) { .bento-dashboard { grid-template-columns: 1fr; } .welcome-bento, .collection-bento, .students-bento, .admissions-bento, .alert-bento, .actions-bento { grid-column: span 1; } .welcome-bento { flex-direction: column; text-align: center; } }
</style>

<!-- BACKGROUND 3D ELEMENTS (New Space Dust) -->
<div class="home-bg-3d">
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="space-dust dust-layer-1"></div>
    <div class="space-dust dust-layer-2"></div>
</div>

<div class="home-master-center">
    <div class="bento-dashboard">
        
        <!-- Row 1: Welcome & Revenue -->
        <div class="bento-card welcome-bento js-tilt">
            <img src="logo.png" class="bento-logo" alt="Purix Academy">
            <div class="welcome-info">
                <h1>Purix Academy</h1>
                <p>Central Command Node & Academic Database</p>
                <div class="live-clock-badge">
                    <i class="fa-solid fa-clock"></i> <span id="realtimeClock">Loading Time...</span>
                </div>
            </div>
        </div>
        
        <div class="bento-card collection-bento js-tilt">
            <i class="fa-solid fa-wallet bento-bg-icon"></i>
            <div class="stat-header"><i class="fa-solid fa-indian-rupee-sign"></i> TODAY'S COLLECTION</div>
            <h2 class="stat-value" id="homeTodayCollection"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
        </div>

        <!-- Row 2: Operations Data -->
        <div class="bento-card students-bento js-tilt">
            <i class="fa-solid fa-users-viewfinder bento-bg-icon"></i>
            <div class="stat-header"><i class="fa-solid fa-users"></i> ACTIVE STUDENTS</div>
            <h2 class="stat-value" id="homeActiveStudents"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
        </div>

        <div class="bento-card admissions-bento js-tilt">
            <i class="fa-solid fa-user-astronaut bento-bg-icon"></i>
            <div class="stat-header"><i class="fa-solid fa-user-plus"></i> TODAY'S ADMISSIONS</div>
            <h2 class="stat-value" id="homeMonthAdmission"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
        </div>

        <div class="bento-card alert-bento js-tilt" onclick="loadModule('alerts')">
            <i class="fa-solid fa-triangle-exclamation bento-bg-icon"></i>
            <div class="stat-header"><i class="fa-solid fa-bell"></i> OVERDUE ALERTS</div>
            <h2 class="stat-value" id="alertCount"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
        </div>

        <!-- Row 3: Action Buttons Matrix -->
        <div class="actions-bento">
            <div class="action-btn js-tilt" onclick="loadModule('admission')">
                <i class="fa-solid fa-id-card-clip"></i><span>New Admission</span>
            </div>
            <div class="action-btn js-tilt" onclick="loadModule('payment')">
                <i class="fa-solid fa-hand-holding-dollar"></i><span>Collect Fee</span>
            </div>
            <div class="action-btn js-tilt" onclick="loadModule('profile')">
                <i class="fa-solid fa-magnifying-glass-chart"></i><span>Search Profile</span>
            </div>
            <div class="action-btn js-tilt" onclick="loadModule('reports')">
                <i class="fa-solid fa-file-invoice"></i><span>View Reports</span>
            </div>
        </div>

    </div>
</div>

<script>
    (function() {
        // --- 3D MOUSE HOVER EFFECT (Dynamic Tilt) ---
        const tiltElements = document.querySelectorAll('.js-tilt');
        
        tiltElements.forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left; 
                const y = e.clientY - rect.top;  
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -15; 
                const rotateY = ((x - centerX) / centerX) * 15;
                
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
            });
            
            card.addEventListener('mouseleave', () => {
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            });
        });

        // --- SAFE LIVE CLOCK ---
        function updateClock() {
            const clockElement = document.getElementById('realtimeClock');
            if (!clockElement) return; 

            const now = new Date();
            const timeString = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            const dateString = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
            clockElement.innerText = `${dateString} | ${timeString}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- DATA CACHING & FETCH LOGIC ---
        const CACHE_DURATION_MS = 5 * 60 * 1000; 

        function loadDashboardData() {
            const now = new Date().getTime();
            const cachedStatsString = localStorage.getItem('purix_home_stats');
            let cachedStats = null;
            if (cachedStatsString) { try { cachedStats = JSON.parse(cachedStatsString); } catch (e) {} }

            if (cachedStats && cachedStats.timestamp && (now - cachedStats.timestamp < CACHE_DURATION_MS)) {
                updateStatsUI(cachedStats.data);
            } else {
                fetch(API_URL + "?action=getStats")
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") {
                            updateStatsUI(data.data);
                            localStorage.setItem('purix_home_stats', JSON.stringify({ timestamp: now, data: data.data }));
                        }
                    });
            }

            const todayStr = new Date().toDateString();
            const cachedAlertsDate = localStorage.getItem('purix_alerts_date');
            const cachedAlertsData = localStorage.getItem('purix_alerts_data');

            if (cachedAlertsDate === todayStr && cachedAlertsData) {
                document.getElementById('alertCount').innerText = countRealOverdueAlerts(JSON.parse(cachedAlertsData));
            } else {
                fetch(API_URL + "?action=getAlerts")
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") {
                            localStorage.setItem('purix_alerts_date', todayStr);
                            localStorage.setItem('purix_alerts_data', JSON.stringify(data.data));
                            document.getElementById('alertCount').innerText = countRealOverdueAlerts(data.data);
                        }
                    });
            }
        }

        // --- 🔥 BULLETPROOF SELF-HEALING UI UPDATE ---
        function updateStatsUI(data) {
            if (!data) return;

            if (data.todayAdmissions === undefined && data.monthAdmission !== undefined) {
                localStorage.removeItem('purix_home_stats'); 
            }

            let active = data.activeStudents !== undefined ? data.activeStudents : 0;
            let admissions = data.todayAdmissions !== undefined ? data.todayAdmissions : (data.monthAdmission || 0);
            let collection = data.todayCollection !== undefined ? data.todayCollection : 0;

            document.getElementById('homeActiveStudents').innerText = active;
            document.getElementById('homeMonthAdmission').innerText = admissions;
            document.getElementById('homeTodayCollection').innerText = "₹" + collection;
        }

        function countRealOverdueAlerts(alertsList) {
            let criticalCount = 0;
            alertsList.forEach(student => {
                let due = new Date(student.dueDate);
                if (!isNaN(due.getTime())) {
                    due.setHours(0,0,0,0);
                    let today = new Date(); today.setHours(0,0,0,0);
                    let diff = Math.ceil((due.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
                    if (diff < 0) criticalCount++; 
                }
            });
            return criticalCount;
        }

        // --- AUTO SYNC ---
        loadDashboardData();
        setInterval(loadDashboardData, 60000); 
    })();
</script>
