<style>
    /* MASTER WRAPPER - Ye poore dashboard ko hamesha screen ke CENTER me rakhega */
    .home-master-center {
        display: flex; align-items: center; justify-content: center;
        min-height: calc(100vh - 100px); /* Adjusts to screen height */
        padding: 20px; animation: scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes scaleUp { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }

    /* BENTO GRID SYSTEM */
    .bento-dashboard {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
        width: 100%; max-width: 1150px;
    }

    /* Common Card Style */
    .bento-card {
        background: rgba(11, 16, 33, 0.6); border-radius: 20px; padding: 30px;
        border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        position: relative; overflow: hidden; backdrop-filter: blur(12px);
        transition: 0.4s ease; display: flex; flex-direction: column; justify-content: center;
    }
    .bento-card:hover { transform: translateY(-5px); border-color: rgba(0, 243, 255, 0.3); box-shadow: 0 20px 40px rgba(0, 243, 255, 0.1); }
    
    /* Animated Background Particles / Pulses */
    .bento-card::before {
        content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 50%);
        z-index: 0; animation: gentlePulse 8s infinite alternate ease-in-out;
    }
    @keyframes gentlePulse {
        0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
        100% { transform: scale(1.2) translate(5%, 5%); opacity: 1; }
    }

    .bento-bg-icon {
        position: absolute; right: -15px; bottom: -20px; font-size: 130px; 
        opacity: 0.03; transition: 0.4s ease; z-index: 0;
    }
    .bento-card:hover .bento-bg-icon { transform: scale(1.1) rotate(-10deg); opacity: 0.06; }

    /* Specific Grid Placements */
    .welcome-bento {
        grid-column: span 2; background: linear-gradient(135deg, rgba(0, 243, 255, 0.08), rgba(11, 16, 33, 0.9));
        display: flex; flex-direction: row; align-items: center; gap: 30px; justify-content: flex-start;
        overflow: hidden;
    }
    /* Matrix-style subtle sweeping line for the banner */
    .welcome-bento::after {
        content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
        background: linear-gradient(to right, transparent, rgba(0, 243, 255, 0.1), transparent);
        transform: skewX(-20deg); animation: sweepLine 6s infinite; z-index: 0;
    }
    @keyframes sweepLine {
        0% { left: -100%; }
        100% { left: 200%; }
    }

    .collection-bento { grid-column: span 1; border-bottom: 4px solid #00ff88; }
    .students-bento { border-bottom: 4px solid #00f3ff; }
    .admissions-bento { border-bottom: 4px solid #b366ff; }
    .alert-bento { border-bottom: 4px solid #ff0055; cursor: pointer; }
    
    /* Logo & Welcome Text */
    .bento-logo {
        width: 110px; height: 110px; border-radius: 50%; border: 2px solid #00f3ff;
        box-shadow: 0 0 25px rgba(0, 243, 255, 0.4); padding: 5px; background: rgba(0,0,0,0.5);
        object-fit: cover; z-index: 1;
    }
    .welcome-info { z-index: 1; }
    .welcome-info h1 { margin: 0 0 5px 0; font-size: 32px; color: #fff; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; text-shadow: 0 0 15px rgba(0, 243, 255, 0.5); }
    .welcome-info p { margin: 0; color: #a5c3e0; font-size: 15px; font-family: 'Poppins', sans-serif; letter-spacing: 1px; }
    
    /* Live Clock */
    .live-clock-badge {
        display: inline-flex; align-items: center; gap: 8px; margin-top: 15px;
        background: rgba(0, 243, 255, 0.1); padding: 6px 15px; border-radius: 20px;
        border: 1px solid rgba(0, 243, 255, 0.3); color: #00f3ff; font-family: 'Orbitron', sans-serif; font-size: 13px;
    }

    /* Stat Details */
    .stat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; color: #a5c3e0; font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 1px; z-index: 1; }
    .stat-header i { font-size: 18px; }
    .stat-value { margin: 0; font-size: 38px; color: #fff; font-family: 'Poppins', sans-serif; font-weight: 700; z-index: 2; }
    
    .collection-bento .stat-header i, .collection-bento .stat-value { color: #00ff88; text-shadow: 0 0 20px rgba(0,255,136,0.3); }
    .students-bento .stat-header i, .students-bento .stat-value { color: #00f3ff; text-shadow: 0 0 20px rgba(0,243,255,0.3); }
    .admissions-bento .stat-header i, .admissions-bento .stat-value { color: #b366ff; text-shadow: 0 0 20px rgba(179,102,255,0.3); }
    .alert-bento .stat-header i, .alert-bento .stat-value { color: #ff0055; text-shadow: 0 0 20px rgba(255,0,85,0.3); }
    
    .alert-bento:hover { background: rgba(255, 0, 85, 0.05); border-color: #ff0055; box-shadow: 0 10px 30px rgba(255, 0, 85, 0.2); }

    /* Actions Matrix (Bottom Row) */
    .actions-bento {
        grid-column: span 3; display: flex; gap: 20px; padding: 20px;
        background: transparent; border: none; box-shadow: none; flex-wrap: wrap; justify-content: center;
    }
    .action-btn {
        flex: 1; min-width: 200px; background: rgba(0, 0, 0, 0.5); padding: 20px;
        border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 16px; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        color: #a5c3e0; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500;
        transition: 0.3s; backdrop-filter: blur(5px); position: relative; overflow: hidden;
    }
    
    /* Action button hover sweep */
    .action-btn::before {
        content: ''; position: absolute; top: -100%; left: -100%; width: 50%; height: 300%;
        background: linear-gradient(to right, transparent, rgba(0, 243, 255, 0.2), transparent);
        transform: rotate(45deg); transition: 0.5s; z-index: 0;
    }
    .action-btn:hover::before { top: -50%; left: 150%; }

    .action-btn i { font-size: 28px; color: #00f3ff; transition: 0.3s; z-index: 1; }
    .action-btn span { z-index: 1; }
    
    .action-btn:hover {
        background: rgba(0, 243, 255, 0.1); border-color: #00f3ff; color: #fff;
        transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,243,255,0.15);
    }
    .action-btn:hover i { transform: scale(1.1); text-shadow: 0 0 15px #00f3ff; }

    /* Responsive */
    @media (max-width: 992px) {
        .bento-dashboard { grid-template-columns: 1fr 1fr; }
        .welcome-bento { grid-column: span 2; }
        .collection-bento { grid-column: span 2; }
        .actions-bento { grid-column: span 2; }
    }
    @media (max-width: 768px) {
        .bento-dashboard { grid-template-columns: 1fr; }
        .welcome-bento, .collection-bento, .students-bento, .admissions-bento, .alert-bento, .actions-bento { grid-column: span 1; }
        .welcome-bento { flex-direction: column; text-align: center; }
    }
</style>

<div class="home-master-center">
    <div class="bento-dashboard">
        
        <!-- Row 1: Welcome & Revenue -->
        <div class="bento-card welcome-bento">
            <img src="logo.png" class="bento-logo" alt="Purix Academy">
            <div class="welcome-info">
                <h1>Purix Academy</h1>
                <p>Central Command Node & Academic Database</p>
                <div class="live-clock-badge">
                    <i class="fa-solid fa-clock"></i> <span id="realtimeClock">Loading Time...</span>
                </div>
            </div>
        </div>
        
        <div class="bento-card collection-bento">
            <i class="fa-solid fa-wallet bento-bg-icon"></i>
            <div class="stat-header"><i class="fa-solid fa-indian-rupee-sign"></i> TODAY'S COLLECTION</div>
            <h2 class="stat-value" id="homeTodayCollection"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
        </div>

        <!-- Row 2: Operations Data -->
        <div class="bento-card students-bento">
            <i class="fa-solid fa-users-viewfinder bento-bg-icon"></i>
            <div class="stat-header"><i class="fa-solid fa-users"></i> ACTIVE STUDENTS</div>
            <h2 class="stat-value" id="homeActiveStudents"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
        </div>

        <div class="bento-card admissions-bento">
            <i class="fa-solid fa-user-astronaut bento-bg-icon"></i>
            <div class="stat-header"><i class="fa-solid fa-user-plus"></i> TODAY'S ADMISSIONS</div>
            <h2 class="stat-value" id="homeMonthAdmission"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
        </div>

        <!-- Alerts Integrated into Grid smoothly -->
        <div class="bento-card alert-bento" onclick="loadModule('alerts')">
            <i class="fa-solid fa-triangle-exclamation bento-bg-icon"></i>
            <div class="stat-header"><i class="fa-solid fa-bell"></i> OVERDUE ALERTS</div>
            <h2 class="stat-value" id="alertCount"><i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i></h2>
        </div>

        <!-- Row 3: Action Buttons Matrix -->
        <div class="actions-bento">
            <div class="action-btn" onclick="loadModule('admission')">
                <i class="fa-solid fa-id-card-clip"></i><span>New Admission</span>
            </div>
            <div class="action-btn" onclick="loadModule('payment')">
                <i class="fa-solid fa-hand-holding-dollar"></i><span>Collect Fee</span>
            </div>
            <div class="action-btn" onclick="loadModule('profile')">
                <i class="fa-solid fa-magnifying-glass-chart"></i><span>Search Profile</span>
            </div>
            <div class="action-btn" onclick="loadModule('reports')">
                <i class="fa-solid fa-file-invoice"></i><span>View Reports</span>
            </div>
        </div>

    </div>
</div>

<script>
    (function() {
        // Live Clock Function
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            const dateString = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
            document.getElementById('realtimeClock').innerText = `${dateString} | ${timeString}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Data Caching Logic to prevent 20k API limit exhaustion!
        // We will cache the dashboard stats for 5 minutes.
        const CACHE_DURATION_MS = 5 * 60 * 1000; // 5 minutes

        function loadDashboardData() {
            const now = new Date().getTime();
            const cachedStatsString = localStorage.getItem('purix_home_stats');
            let cachedStats = null;
            
            if (cachedStatsString) {
                try {
                    cachedStats = JSON.parse(cachedStatsString);
                } catch (e) {
                    console.error("Cache parsing error", e);
                }
            }

            // Check if we have valid, unexpired cached data
            if (cachedStats && cachedStats.timestamp && (now - cachedStats.timestamp < CACHE_DURATION_MS)) {
                console.log("Loading dashboard stats from local cache...");
                updateStatsUI(cachedStats.data);
            } else {
                console.log("Fetching fresh dashboard stats from server...");
                fetch(API_URL + "?action=getStats")
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") {
                            // Update UI
                            updateStatsUI(data.data);
                            // Save to cache with timestamp
                            localStorage.setItem('purix_home_stats', JSON.stringify({
                                timestamp: now,
                                data: data.data
                            }));
                        }
                    })
                    .catch(e => console.log("Stats fetch error:", e));
            }

            // Alerts Fetch (Using Daily Cache Logic)
            const todayStr = new Date().toDateString();
            const cachedAlertsDate = localStorage.getItem('purix_alerts_date');
            const cachedAlertsData = localStorage.getItem('purix_alerts_data');

            if (cachedAlertsDate === todayStr && cachedAlertsData) {
                document.getElementById('alertCount').innerText = countRealOverdueAlerts(JSON.parse(cachedAlertsData));
            } else {
                fetch(API_URL + "?action=getAlerts")
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") {
                            localStorage.setItem('purix_alerts_date', todayStr);
                            localStorage.setItem('purix_alerts_data', JSON.stringify(data.data));
                            document.getElementById('alertCount').innerText = countRealOverdueAlerts(data.data);
                        }
                    })
                    .catch(e => console.log("Alert fetching silent fail", e));
            }
        }

        function updateStatsUI(data) {
            document.getElementById('homeActiveStudents').innerText = data.activeStudents;
            document.getElementById('homeMonthAdmission').innerText = data.todayAdmissions;
            document.getElementById('homeTodayCollection').innerText = "₹" + data.todayCollection;
        }

        function countRealOverdueAlerts(alertsList) {
            let criticalCount = 0;
            alertsList.forEach(student => {
                let due = new Date(student.dueDate);
                if (!isNaN(due.getTime())) {
                    due.setHours(0,0,0,0);
                    let today = new Date(); today.setHours(0,0,0,0);
                    let diff = Math.ceil((due.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
                    if (diff < 0) criticalCount++; 
                }
            });
            return criticalCount;
        }

        loadDashboardData();
    })();
</script>
