<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purix Academy - Management System</title>
    
    <link rel="stylesheet" href="style.css">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 for Professional Popups (Payment Success & WhatsApp) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- html2pdf for Professional Multi-page PDF Reports -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-header" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 25px 15px;">
                <img src="logo.png" alt="Logo" style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover;">
                <h2 style="font-size: 18px; letter-spacing: 0.5px;">Purix Academy</h2>
            </div>
            
            <!-- Navigation Links -->
            <ul class="nav-links">
                <li onclick="loadModule('home')" class="active"><i class="fa-solid fa-house"></i> Home</li>
                <li onclick="loadModule('admission')"><i class="fa-solid fa-user-plus"></i> Admission</li>
                <li onclick="loadModule('payment')"><i class="fa-solid fa-indian-rupee-sign"></i> Payment</li>
                <li onclick="loadModule('profile')"><i class="fa-solid fa-id-card"></i> Profile</li>
                <li onclick="loadModule('reports')"><i class="fa-solid fa-chart-pie"></i> Reports</li>
                <li onclick="loadModule('alerts')"><i class="fa-solid fa-bell"></i> Alerts</li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Modules will load inside this div -->
            <div id="module-container" style="padding-top: 10px;">
                <!-- Content loads here -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
