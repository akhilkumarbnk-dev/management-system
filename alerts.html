<style>
    .alerts-wrapper { padding: 10px; }

    .module-header { 
        color: #00f3ff; font-family: 'Orbitron', sans-serif; margin-bottom: 20px; 
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); border-bottom: 1px solid rgba(0, 243, 255, 0.2); 
        padding-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
    }
    .module-header h2 { margin: 0; color: #00f3ff; font-size: 20px; font-family: 'Orbitron', sans-serif; }

    .alerts-container {
        background: rgba(11, 16, 33, 0.8); padding: 30px; border-radius: 12px;
        border: 1px solid rgba(0, 243, 255, 0.2); box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.05);
        max-width: 1000px; margin: 0 auto; backdrop-filter: blur(5px);
    }

    /* 🔥 NEW: PREMIUM TAB NAVIGATION */
    .tabs-nav {
        display: flex; gap: 15px; margin-bottom: 25px; 
        border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px;
        overflow-x: auto;
    }
    .tab-btn {
        background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2);
        color: #a5c3e0; padding: 12px 25px; border-radius: 8px;
        font-family: 'Orbitron', sans-serif; font-size: 14px; cursor: pointer;
        display: flex; align-items: center; gap: 10px; transition: all 0.3s ease;
        white-space: nowrap; flex: 1; justify-content: center;
    }
    .tab-btn:hover { background: rgba(255, 255, 255, 0.05); }

    /* Active Tab Colors */
    .tab-btn.active-failed { background: rgba(255, 0, 85, 0.15); border-color: #ff0055; color: #fff; box-shadow: 0 0 15px rgba(255, 0, 85, 0.3); }
    .tab-btn.active-today { background: rgba(0, 243, 255, 0.15); border-color: #00f3ff; color: #fff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }
    .tab-btn.active-upcoming { background: rgba(255, 170, 0, 0.15); border-color: #ffaa00; color: #fff; box-shadow: 0 0 15px rgba(255, 170, 0, 0.3); }

    /* Live Counters (Badges) */
    .badge {
        padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; background: #333; color: #fff; font-family: 'Poppins', sans-serif;
    }
    .badge-red { background: #ff0055; color: #fff; }
    .badge-blue { background: #00f3ff; color: #000; }
    .badge-orange { background: #ffaa00; color: #000; }

    /* Alert Sections Control */
    .alert-section { display: none; }
    .alert-section.active-section { display: block; animation: slideUpFade 0.4s ease; }
    
    @keyframes slideUpFade {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .alert-list { display: flex; flex-direction: column; gap: 12px; }
    
    .alert-card {
        display: flex; justify-content: space-between; align-items: center;
        padding: 18px 20px; background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 8px; transition: 0.3s;
    }
    .alert-card:hover { box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); transform: translateX(5px); background: rgba(0, 243, 255, 0.03); }
    
    .student-info h4 { margin: 0; font-size: 16px; color: #00f3ff; font-family: 'Orbitron', sans-serif; letter-spacing: 0.5px; }
    .student-info p { margin: 5px 0 0; font-size: 13px; color: #a5c3e0; font-family: 'Poppins', sans-serif; }

    .alert-actions { display: flex; gap: 12px; align-items: center; }
    
    .btn-notify {
        background: rgba(37, 211, 102, 0.15); color: #25D366; border: 1px solid #25D366;
        padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
        font-family: 'Orbitron', sans-serif; transition: 0.3s; display: flex; align-items: center; gap: 6px;
    }
    .btn-notify:hover { background: #25D366; color: #fff; box-shadow: 0 0 15px #25D366; }

    .btn-critical-inactive {
        background: rgba(255, 0, 85, 0.15); color: #ff0055; border: 1px solid #ff0055;
        padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
        animation: pulseRed 2s infinite; transition: 0.3s;
    }
    .btn-critical-inactive:hover { background: #ff0055; color: #fff; box-shadow: 0 0 20px #ff0055; }
    
    @keyframes pulseRed {
        0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
        70% { box-shadow: 0 0 0 10px rgba(255, 0, 85, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
    }

    .empty-msg {
        color: #a5c3e0; font-style: italic; padding: 25px; text-align: center; font-family: 'Poppins', sans-serif; font-size: 14px;
        background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px dashed rgba(255,255,255,0.1);
    }
</style>

<div class="alerts-wrapper">
    <div class="alerts-container">
        <div class="alerts-header">
            <h2 class="module-header"><i class="fa-solid fa-bell"></i> SMART PAYMENT ALERTS
                <span id="currentDateDisplay" style="color: #a5c3e0; font-weight: 500; font-family: 'Orbitron', sans-serif; font-size: 12px; text-shadow: none;"></span>
            </h2>
        </div>

        <!-- 🔥 TABS NAVIGATION BAR -->
        <div class="tabs-nav">
            <button class="tab-btn active-failed" id="btn-failed" onclick="switchAlertTab('failed')">
                <i class="fa-solid fa-triangle-exclamation"></i> OVERDUE
                <span class="badge badge-red" id="badge-failed"><i class="fa-solid fa-spinner fa-spin"></i></span>
            </button>
            <button class="tab-btn" id="btn-today" onclick="switchAlertTab('today')">
                <i class="fa-solid fa-calendar-day"></i> TODAY
                <span class="badge badge-blue" id="badge-today"><i class="fa-solid fa-spinner fa-spin"></i></span>
            </button>
            <button class="tab-btn" id="btn-upcoming" onclick="switchAlertTab('upcoming')">
                <i class="fa-solid fa-clock-rotate-left"></i> UPCOMING
                <span class="badge badge-orange" id="badge-upcoming"><i class="fa-solid fa-spinner fa-spin"></i></span>
            </button>
        </div>

        <!-- Failed Payments Section -->
        <div class="alert-section active-section" id="sec-failed">
            <div class="alert-list" id="failedList">
                <div class="empty-msg"><i class="fa-solid fa-spinner fa-spin"></i> Loading Defaulters...</div>
            </div>
        </div>

        <!-- Today Payments Section -->
        <div class="alert-section" id="sec-today">
            <div class="alert-list" id="todayList">
                <div class="empty-msg"><i class="fa-solid fa-spinner fa-spin"></i> Loading Today's Due...</div>
            </div>
        </div>

        <!-- Upcoming Payments Section -->
        <div class="alert-section" id="sec-upcoming">
            <div class="alert-list" id="upcomingList">
                <div class="empty-msg"><i class="fa-solid fa-spinner fa-spin"></i> Loading Upcoming...</div>
            </div>
        </div>
    </div>
</div>

<script>
// Tab Switching Logic
function switchAlertTab(tabName) {
    // Sabhi buttons aur sections se active class hata do
    document.getElementById('btn-failed').className = "tab-btn";
    document.getElementById('btn-today').className = "tab-btn";
    document.getElementById('btn-upcoming').className = "tab-btn";
    
    document.getElementById('sec-failed').classList.remove('active-section');
    document.getElementById('sec-today').classList.remove('active-section');
    document.getElementById('sec-upcoming').classList.remove('active-section');

    // Jo click hua usko activate karo
    document.getElementById(`sec-${tabName}`).classList.add('active-section');
    document.getElementById(`btn-${tabName}`).classList.add(`active-${tabName}`);
}

(function() {
    const today = new Date();
    const dateDisplay = document.getElementById('currentDateDisplay');
    if(dateDisplay) {
        dateDisplay.innerText = `SYSTEM DATE: ${today.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase()}`;
    }

    function calculateDaysDifference(dueDateStr) {
        if (!dueDateStr || dueDateStr === "-" || dueDateStr.trim() === "") return 999; 
        const dueDate = new Date(dueDateStr);
        if (isNaN(dueDate.getTime())) return 999; 
        
        dueDate.setHours(0,0,0,0);
        const todayMidnight = new Date();
        todayMidnight.setHours(0,0,0,0);
        
        const diffTime = dueDate.getTime() - todayMidnight.getTime();
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
    }

    function getPendingMonthsText(dueDateStr) {
        if(!dueDateStr || dueDateStr === "-") return "Multiple";
        let due = new Date(dueDateStr);
        if (isNaN(due.getTime())) return "Multiple";

        let now = new Date(); let months = [];
        let monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        let current = new Date(due);
        while(current <= now || (current.getMonth() === now.getMonth() && current.getFullYear() === now.getFullYear())) {
            months.push(monthNames[current.getMonth()]);
            current.setMonth(current.getMonth() + 1);
        }
        
        if(months.length === 0) return monthNames[due.getMonth()]; 
        if(months.length === 1) return months[0];
        if(months.length === 2) return months.join(" aur ");
        return months.slice(0, -1).join(", ") + " aur " + months[months.length - 1];
    }

    window.directInactive = function(uid, name) {
        Swal.fire({
            title: 'Deactivate Student?',
            text: `${name} (UID: ${uid}) has defaulted payment. Mark INACTIVE?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ff0055', cancelButtonColor: '#334155',
            confirmButtonText: 'Yes, Deactivate', background: '#050914', color: '#fff'
        }).then((result) => {
            if (result.isConfirmed) {
                // Instantly remove from UI and RAM
                if (window.cachedAlertsData) {
                    window.cachedAlertsData = window.cachedAlertsData.filter(s => String(s.uid) !== String(uid));
                    renderAlerts(window.cachedAlertsData); 
                } else {
                    let card = document.getElementById(`alert-card-${uid}`);
                    if(card) card.remove();
                }
                // Background update
                fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: 'toggleStatus', uid: uid, status: 'Inactive' })
                }).then(res => res.json()).then(data => {
                    if(data.status === 'success') {
                        Swal.fire({ title: 'Deactivated!', icon: 'success', background: '#050914', color: '#00ff88', timer: 1500, showConfirmButton: false });
                    }
                });
            }
        });
    };

    window.sendWhatsAppAlert = function(mobile, name, dues, feePlan, dueDateStr) {
        let message = "";
        if (feePlan === "Monthly") {
            let monthsText = getPendingMonthsText(dueDateStr);
            message = `Dear ${name}, aapka ${monthsText} mahine ka fee dues (Rs. ${dues}) baki hai. Kripya jald se jald payment clear karein. Thank you - Purix Academy.`;
        } else {
            message = `Dear ${name}, aapki aagami Installment (kist) Rs. ${dues} due hai. Kripya jald se jald payment clear karein. Thank you - Purix Academy.`;
        }
        window.open(`https://wa.me/91${mobile}?text=${encodeURIComponent(message)}`, '_blank');
    };

    function renderAlerts(alertData) {
        const failedList = document.getElementById('failedList');
        const todayList = document.getElementById('todayList');
        const upcomingList = document.getElementById('upcomingList');
        
        failedList.innerHTML = ''; todayList.innerHTML = ''; upcomingList.innerHTML = '';
        let fCount = 0, tCount = 0, uCount = 0;

        alertData.forEach(student => {
            let daysDiff = calculateDaysDifference(student.dueDate);
            let hasDues = parseFloat(student.dues) > 0;
            let planText = student.feePlan || 'Monthly';
            
            let isOverdue = false, isToday = false, isUpcoming = false;

            if (daysDiff < 0 && hasDues) { isOverdue = true; } 
            else if (daysDiff === 0 && hasDues) { isToday = true; } 
            else if (daysDiff > 0 && daysDiff <= 5 && hasDues) { isUpcoming = true; } 
            else if (student.status !== 'Active' && hasDues) { isOverdue = true; }

            if (!isOverdue && !isToday && !isUpcoming) return;

            let borderColor = isOverdue ? '#ff0055' : (isToday ? '#00f3ff' : '#ffaa00');
            let readableDate = (student.dueDate && student.dueDate !== "-") ? new Date(student.dueDate).toLocaleDateString('en-GB') : "N/A";

            let cardHtml = `
                <div class="alert-card" id="alert-card-${student.uid}" style="border-left: 5px solid ${borderColor}">
                    <div class="student-info">
                        <h4>${student.name} <span style="font-size:12px; color:#a5c3e0;">(UID: ${student.uid})</span></h4>
                        <p>Class: ${student.class} | Plan: <strong style="color:${planText==='Monthly'?'#00f3ff':'#b366ff'}">${planText}</strong> | Due Date: <strong>${readableDate}</strong> | Amt: <span style="color:#ff0055; font-weight:bold; text-shadow: 0 0 5px rgba(255,0,85,0.4);">₹${student.dues}</span></p>
                    </div>
                    <div class="alert-actions">
                        <button class="btn-notify" onclick="sendWhatsAppAlert('${student.mobile}', '${student.name}', ${student.dues}, '${planText}', '${student.dueDate}')">
                            <i class="fa-brands fa-whatsapp"></i> NOTIFY
                        </button>
                        ${(isOverdue && daysDiff <= -60) ? `
                        <button class="btn-critical-inactive" onclick="directInactive('${student.uid}', '${student.name}')" title="2 Months Default">
                            <i class="fa-solid fa-user-slash"></i> DEACTIVATE
                        </button>` : ''}
                    </div>
                </div>
            `;

            if (isOverdue) { failedList.innerHTML += cardHtml; fCount++; } 
            else if (isToday) { todayList.innerHTML += cardHtml; tCount++; } 
            else if (isUpcoming) { upcomingList.innerHTML += cardHtml; uCount++; }
        });

        // 🔥 Update Live Badges
        document.getElementById('badge-failed').innerText = fCount;
        document.getElementById('badge-today').innerText = tCount;
        document.getElementById('badge-upcoming').innerText = uCount;

        // Empty states
        if(fCount === 0) failedList.innerHTML = `<div class="empty-msg"><i class="fa-solid fa-check-circle" style="color:#00ff88;"></i> All clear! No overdue payments.</div>`;
        if(tCount === 0) todayList.innerHTML = `<div class="empty-msg"><i class="fa-regular fa-calendar-check" style="color:#00f3ff;"></i> No payments scheduled for today.</div>`;
        if(uCount === 0) upcomingList.innerHTML = `<div class="empty-msg"><i class="fa-solid fa-mug-hot" style="color:#ffaa00;"></i> Relax! No upcoming payments in next 5 days.</div>`;
    }

    function fetchAndGenerateAlerts() {
        if (window.cachedAlertsData) {
            renderAlerts(window.cachedAlertsData);
            return;
        }

        fetch(API_URL + "?action=getAlerts&timestamp=" + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    window.cachedAlertsData = data.data; 
                    renderAlerts(data.data);
                } else { showErrorState(); }
            }).catch(err => showErrorState());
    }

    function showErrorState() {
        document.getElementById('failedList').innerHTML = `<div class="empty-msg" style="color:#ff0055;">Database connection error. Hit Refresh (F5).</div>`;
        document.getElementById('badge-failed').innerText = "!";
        document.getElementById('badge-today').innerText = "!";
        document.getElementById('badge-upcoming').innerText = "!";
    }

    fetchAndGenerateAlerts();
})();
</script>
