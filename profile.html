<style>
    .profile-wrapper { padding: 10px; }
    
    .module-header { 
        color: #00f3ff; font-family: 'Orbitron', sans-serif; margin-bottom: 25px; 
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); border-bottom: 1px solid rgba(0, 243, 255, 0.2); 
        padding-bottom: 10px; display: flex; align-items: center; gap: 15px;
    }

    .profile-container {
        background: rgba(11, 16, 33, 0.8); padding: 30px; border-radius: 12px;
        border: 1px solid rgba(0, 243, 255, 0.2); box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.05);
        max-width: 900px; margin: 0 auto; backdrop-filter: blur(5px);
    }
    
    .search-section { display: flex; gap: 15px; margin-bottom: 30px; }
    .search-section input {
        flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 243, 255, 0.3);
        padding: 12px 18px; border-radius: 8px; color: #fff; font-size: 15px;
        font-family: 'Poppins', sans-serif; outline: none; transition: 0.3s;
    }
    .search-section input:focus {
        border-color: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); background: rgba(0, 243, 255, 0.05);
    }
    .cyber-search-btn {
        background: rgba(0, 243, 255, 0.1); border: 1px solid #00f3ff; color: #00f3ff;
        padding: 0 30px; border-radius: 8px; cursor: pointer; font-family: 'Orbitron', sans-serif;
        font-weight: bold; letter-spacing: 1px; transition: 0.3s; box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }
    .cyber-search-btn:hover { background: #00f3ff; color: #050914; box-shadow: 0 0 20px rgba(0, 243, 255, 0.6); transform: translateY(-2px); }

    /* 🔥 NEW: Mini Cards for Multiple Students */
    #multiStudentArea { display: none; margin-bottom: 30px; animation: fadeIn 0.4s; }
    #multiStudentArea h3 { color: #b366ff; font-size: 16px; margin-bottom: 15px; font-family: 'Orbitron', sans-serif; }
    .mini-card-container { display: flex; flex-wrap: wrap; gap: 15px; }
    .mini-card {
        background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0, 243, 255, 0.3);
        border-radius: 8px; padding: 15px; cursor: pointer; transition: 0.3s; width: calc(50% - 8px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .mini-card:hover { background: rgba(0, 243, 255, 0.15); border-color: #00f3ff; box-shadow: 0 0 15px rgba(0,243,255,0.3); transform: translateY(-3px); }
    .mini-card h4 { color: #00f3ff; font-family: 'Orbitron', sans-serif; margin-bottom: 5px; font-size: 15px; }
    .mini-card p { color: #a5c3e0; font-size: 13px; margin: 2px 0; font-family: 'Poppins', sans-serif; }

    #profileCard {
        display: none; border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 12px;
        overflow: hidden; background: rgba(0, 0, 0, 0.4); box-shadow: 0 0 25px rgba(0, 243, 255, 0.1);
        animation: fadeIn 0.4s ease-in;
    }

    .profile-header {
        background: linear-gradient(135deg, rgba(0, 243, 255, 0.15) 0%, rgba(179, 102, 255, 0.2) 100%);
        color: white; text-align: center; padding: 25px; border-bottom: 1px solid rgba(0, 243, 255, 0.3);
    }
    .profile-header h2 { margin: 0; font-size: 24px; color: #00f3ff; font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px rgba(0,243,255,0.5); display: flex; align-items: center; justify-content: center; gap: 15px;}
    .profile-header p { margin: 8px 0 0; color: #a5c3e0; font-size: 14px; letter-spacing: 1px; }
    
    .profile-actions {
        padding: 15px 25px; background: rgba(0, 0, 0, 0.6); border-bottom: 1px solid rgba(0, 243, 255, 0.2);
        display: flex; justify-content: flex-end; gap: 15px;
    }
    .action-btn {
        padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;
        display: flex; align-items: center; gap: 8px; font-family: 'Orbitron', sans-serif; font-size: 13px; transition: 0.3s;
    }
    .btn-edit { background: rgba(255, 170, 0, 0.15); border: 1px solid #ffaa00; color: #ffaa00; }
    .btn-save-pdf { background: rgba(0, 255, 136, 0.15); border: 1px solid #00ff88; color: #00ff88; }
    
    .profile-body { padding: 30px; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 35px; }
    .info-group { display: flex; flex-direction: column; gap: 8px; }
    .info-group label { font-size: 12px; color: #a5c3e0; font-weight: 600; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    .info-group input {
        padding: 12px 15px; border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 6px;
        font-size: 15px; color: #fff; font-weight: 500; background: rgba(0, 0, 0, 0.4); outline: none;
    }
    .info-group input.editable { border-color: #00f3ff; background: rgba(0, 243, 255, 0.05); color: #fff; }
    .info-group input.locked { pointer-events: none; opacity: 0.8; }

    .history-section h3 {
        color: #b366ff; margin-bottom: 15px; font-family: 'Orbitron', sans-serif; font-size: 16px; 
        border-bottom: 1px solid rgba(179, 102, 255, 0.3); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    }
    .history-table { width: 100%; border-collapse: collapse; }
    .history-table th, .history-table td { padding: 14px; text-align: left; border-bottom: 1px solid rgba(0, 243, 255, 0.15); font-size: 14px; color: #a5c3e0; }
    .history-table th { background: rgba(0, 0, 0, 0.6); color: #00f3ff; font-family: 'Orbitron', sans-serif; font-size: 13px; }
    
    .dues-alert { color: #ff0055; font-weight: bold; background: rgba(255,0,85,0.1); padding: 4px 10px; border-radius: 4px; font-size: 13px; }

    @media print {
        body * { visibility: hidden; }
        .profile-container, .profile-container * { visibility: visible; }
        .profile-container { position: absolute; left: 0; top: 0; width: 100%; }
        .search-section, .profile-actions, #multiStudentArea, #loadingIndicator { display: none !important; }
    }
</style>

<div class="profile-wrapper">
    <h2 class="module-header"><i class="fa-solid fa-id-card"></i> STUDENT PROFILE & RECORDS</h2>

    <div class="profile-container" id="printableProfileArea">
        
        <div class="search-section">
            <input type="text" id="profileSearchInput" placeholder="Enter Student UID or Mobile No.">
            <button class="cyber-search-btn" id="profSearchBtn" onclick="searchProfile()"><i class="fa-solid fa-magnifying-glass"></i> SEARCH</button>
        </div>

        <!-- 🔥 NEW: Universal Fast Radar Loader -->
        <div class="hud-radar-loader-wrapper" id="loadingIndicator" style="display: none;">
            <div class="hud-fast-radar">
                <div class="radar-cross"></div>
                <div class="radar-core"></div>
            </div>
            <div class="hud-loading-text">SCANNING DATABASE...</div>
