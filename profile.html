<style>
    .profile-wrapper { padding: 10px; }
    .module-header { color: #00f3ff; font-family: 'Orbitron', sans-serif; margin-bottom: 25px; text-shadow: 0 0 10px rgba(0,243,255,0.5); border-bottom: 1px solid rgba(0,243,255,0.2); padding-bottom: 10px; display: flex; align-items: center; gap: 15px; }
    .profile-container { background: rgba(11,16,33,0.8); padding: 30px; border-radius: 12px; border: 1px solid rgba(0,243,255,0.2); box-shadow: inset 0 0 20px rgba(0,243,255,0.05); max-width: 900px; margin: 0 auto; backdrop-filter: blur(5px); }
    .search-section { display: flex; gap: 15px; margin-bottom: 30px; }
    .search-section input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,243,255,0.3); padding: 12px 18px; border-radius: 8px; color: #fff; font-size: 15px; font-family: 'Poppins', sans-serif; outline: none; transition: 0.3s; }
    .search-section input:focus { border-color: #00f3ff; box-shadow: 0 0 15px rgba(0,243,255,0.3); background: rgba(0,243,255,0.05); }
    .cyber-search-btn { background: rgba(0,243,255,0.1); border: 1px solid #00f3ff; color: #00f3ff; padding: 0 30px; border-radius: 8px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-weight: bold; letter-spacing: 1px; transition: 0.3s; box-shadow: 0 0 10px rgba(0,243,255,0.2); }
    .cyber-search-btn:hover { background: #00f3ff; color: #050914; box-shadow: 0 0 20px rgba(0,243,255,0.6); transform: translateY(-2px); }
    #multiStudentArea { display: none; margin-bottom: 30px; animation: fadeIn 0.4s; }
    #multiStudentArea h3 { color: #b366ff; font-size: 16px; margin-bottom: 15px; font-family: 'Orbitron', sans-serif; }
    .mini-card-container { display: flex; flex-wrap: wrap; gap: 15px; }
    .mini-card { background: rgba(0,243,255,0.05); border: 1px solid rgba(0,243,255,0.3); border-radius: 8px; padding: 15px; cursor: pointer; transition: 0.3s; width: calc(50% - 8px); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .mini-card:hover { background: rgba(0,243,255,0.15); border-color: #00f3ff; box-shadow: 0 0 15px rgba(0,243,255,0.3); transform: translateY(-3px); }
    .mini-card h4 { color: #00f3ff; font-family: 'Orbitron', sans-serif; margin-bottom: 5px; font-size: 15px; }
    .mini-card p { color: #a5c3e0; font-size: 13px; margin: 2px 0; font-family: 'Poppins', sans-serif; }
    #profileCard { display: none; border: 1px solid rgba(0,243,255,0.3); border-radius: 12px; overflow: hidden; background: rgba(0,0,0,0.4); box-shadow: 0 0 25px rgba(0,243,255,0.1); animation: fadeIn 0.4s ease-in; }
    .profile-header { background: linear-gradient(135deg, rgba(0,243,255,0.15) 0%, rgba(179,102,255,0.2) 100%); color: white; text-align: center; padding: 25px; border-bottom: 1px solid rgba(0,243,255,0.3); }
    .profile-header h2 { margin: 0; font-size: 24px; color: #00f3ff; font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px rgba(0,243,255,0.5); display: flex; align-items: center; justify-content: center; gap: 15px; }
    .profile-header p { margin: 8px 0 0; color: #a5c3e0; font-size: 14px; letter-spacing: 1px; }
    .profile-actions { padding: 15px 25px; background: rgba(0,0,0,0.6); border-bottom: 1px solid rgba(0,243,255,0.2); display: flex; justify-content: flex-end; gap: 15px; }
    .action-btn { padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; font-family: 'Orbitron', sans-serif; font-size: 13px; transition: 0.3s; }
    .btn-edit { background: rgba(255,170,0,0.15); border: 1px solid #ffaa00; color: #ffaa00; }
    .btn-save-pdf { background: rgba(0,255,136,0.15); border: 1px solid #00ff88; color: #00ff88; }
    .profile-body { padding: 30px; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 35px; }
    .info-group { display: flex; flex-direction: column; gap: 8px; }
    .info-group label { font-size: 12px; color: #a5c3e0; font-weight: 600; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    .info-group input { padding: 12px 15px; border: 1px solid rgba(0,243,255,0.2); border-radius: 6px; font-size: 15px; color: #fff; font-weight: 500; background: rgba(0,0,0,0.4); outline: none; }
    .info-group input.editable { border-color: #00f3ff; background: rgba(0,243,255,0.05); color: #fff; }
    .info-group input.locked { pointer-events: none; opacity: 0.8; }
    .history-section h3 { color: #b366ff; margin-bottom: 15px; font-family: 'Orbitron', sans-serif; font-size: 16px; border-bottom: 1px solid rgba(179,102,255,0.3); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .history-table { width: 100%; border-collapse: collapse; }
    .history-table th, .history-table td { padding: 14px; text-align: left; border-bottom: 1px solid rgba(0,243,255,0.15); font-size: 14px; color: #a5c3e0; }
    .history-table th { background: rgba(0,0,0,0.6); color: #00f3ff; font-family: 'Orbitron', sans-serif; font-size: 13px; }
    .dues-alert { color: #ff0055; font-weight: bold; background: rgba(255,0,85,0.1); padding: 4px 10px; border-radius: 4px; font-size: 13px; }
    .btn-retry-l { margin-left: 8px; background: transparent; color: #00f3ff; border: 1px solid #00f3ff; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 11px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 700px) { .mini-card { width: 100%; } }

    /* ===== Print / PDF statement (A4) ===== */
    #pxPrintDoc { display: none; }
    .pd-head { display: flex; align-items: center; gap: 14px; padding-bottom: 10px; }
    .pd-logo { width: 62px; height: 62px; object-fit: contain; }
    .pd-org b { display: block; font: 700 24px 'Orbitron', Arial, sans-serif; color: #0b1535; letter-spacing: 1px; }
    .pd-org span { display: block; font-size: 12px; color: #16336b; letter-spacing: 1px; margin-top: 2px; }
    .pd-org em { display: block; font-style: normal; font-size: 10px; color: #6b7a99; margin-top: 2px; }
    .pd-ref { margin-left: auto; text-align: right; font-size: 10px; color: #6b7a99; line-height: 1.5; }
    .pd-ref b { display: block; font-size: 12px; color: #0b1535; }
    .pd-line { height: 4px; background: linear-gradient(90deg, #0b1535, #16336b 60%, #00b8d4); border-radius: 2px; margin-bottom: 14px; }
    .pd-title { text-align: center; font-weight: 700; letter-spacing: 3px; font-size: 13px; color: #16336b; margin-bottom: 12px; }
    .pd-sec { font-size: 11px; font-weight: 700; color: #fff; background: #16336b; padding: 5px 10px; border-radius: 3px; text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 6px; }
    .pd-info { width: 100%; border-collapse: collapse; }
    .pd-info td { padding: 5px 8px; font-size: 12px; border-bottom: 1px solid #e3e9f5; }
    .pd-info td.k { width: 17%; color: #6b7a99; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
    .pd-info td.v { width: 33%; font-weight: 600; color: #1a2238; }
    .pd-badge { display: inline-block; padding: 1px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; }
    .pd-stats { display: flex; gap: 8px; margin: 6px 0; }
    .pd-stat { flex: 1; border: 1px solid #d5ddef; border-radius: 6px; padding: 8px 10px; background: #f6f8fd; }
    .pd-stat small { display: block; font-size: 9px; color: #6b7a99; text-transform: uppercase; letter-spacing: .5px; }
    .pd-stat b { font-size: 15px; color: #0b1535; }
    .pd-led { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .pd-led th { background: #eef2fa; color: #16336b; font-size: 10px; text-transform: uppercase; text-align: left; padding: 6px 8px; border-bottom: 2px solid #16336b; }
    .pd-led td { padding: 6px 8px; font-size: 11px; border-bottom: 1px solid #e3e9f5; }
    .pd-led tr { page-break-inside: avoid; }
    .pd-led thead { display: table-header-group; }
    .pd-led .r { text-align: right; }
    .pd-led tfoot td { font-weight: 700; border-top: 2px solid #16336b; border-bottom: 0; background: #f6f8fd; }
    .pd-sign { display: flex; justify-content: space-between; margin-top: 46px; page-break-inside: avoid; }
    .pd-sign div { width: 190px; border-top: 1px solid #6b7a99; text-align: center; padding-top: 4px; font-size: 10px; color: #6b7a99; }
    .pd-note { margin-top: 14px; text-align: center; font-size: 9px; color: #8a97b3; }
    @media print {
        @page { size: A4; margin: 12mm; }
        body > *:not(#pxPrintDoc) { display: none !important; }
        #pxPrintDoc { display: block !important; background: #fff; color: #1a2238; font-family: 'Poppins', Arial, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
</style>

<div class="profile-wrapper">
    <h2 class="module-header"><i class="fa-solid fa-id-card"></i> STUDENT PROFILE & RECORDS</h2>

    <div class="profile-container" id="printableProfileArea">
        <div class="search-section">
            <input type="text" id="profileSearchInput" placeholder="Enter Student UID or Mobile No." autocomplete="off">
            <button class="cyber-search-btn" id="profSearchBtn" onclick="searchProfile()"><i class="fa-solid fa-magnifying-glass"></i> SEARCH</button>
        </div>

        <div class="hud-radar-loader-wrapper" id="loadingIndicator" style="display: none;">
            <div class="hud-fast-radar"><div class="radar-cross"></div><div class="radar-core"></div></div>
            <div class="hud-loading-text">SCANNING DATABASE...</div>
        </div>

        <div id="multiStudentArea">
            <h3><i class="fa-solid fa-users"></i> Multiple Students Found. Select Profile:</h3>
            <div class="mini-card-container" id="miniCardContainer"></div>
        </div>

        <div id="profileCard">
            <div class="profile-header">
                <h2><img src="logo.png" style="width: 45px; height: 45px; border-radius: 50%; margin-right: 12px; vertical-align: middle; object-fit: cover;"> PURIX ACADEMY</h2>
                <p>Student Academic & Financial Dossier</p>
            </div>

            <div class="profile-actions">
                <button class="action-btn btn-edit" id="editBtn" onclick="toggleEdit()"><i class="fa-solid fa-pen-to-square"></i> EDIT DETAILS</button>
                <button class="action-btn btn-save-pdf" onclick="generateProfilePDF()"><i class="fa-solid fa-file-pdf"></i> SAVE AS PDF</button>
            </div>

            <div class="profile-body">
                <form id="profileForm">
                    <div class="info-grid">
                        <div class="info-group"><label>UID (Roll No)</label><input type="text" id="p_uid" class="locked" readonly></div>
                        <div class="info-group"><label>Student Name</label><input type="text" id="p_name" class="locked" readonly></div>
                        <div class="info-group"><label>Father Name</label><input type="text" id="p_father" class="locked" readonly></div>
                        <div class="info-group"><label>Mobile No.</label><input type="number" id="p_mobile" class="profile-input locked" readonly></div>
                        <div class="info-group"><label>ID No.</label><input type="text" id="p_aadhar" class="profile-input locked" readonly placeholder="[Redacted]"></div>
                        <div class="info-group"><label>Class / Session</label><input type="text" id="p_class" class="profile-input locked" readonly></div>
                        <div class="info-group" style="grid-column: 1 / -1;">
                            <label>Subjects</label><input type="text" id="p_subject" class="profile-input locked" readonly style="width: 100%; white-space: normal;">
                        </div>
                        <div class="info-group"><label>Status</label><input type="text" id="p_status" class="locked" readonly></div>
                    </div>
                </form>

                <div class="history-section">
                    <h3><span><i class="fa-solid fa-clock-rotate-left"></i> Payment Ledger</span><span id="p_dues_alert" class="dues-alert"></span></h3>
                    <table class="history-table">
                        <thead><tr><th>Date & Time</th><th>Amount Paid</th><th>Method</th><th>Remarks</th></tr></thead>
                        <tbody id="paymentHistoryBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    // Print statement ke header me dikhne wali details (khali = line nahi dikhegi)
    const ACADEMY = { name: 'PURIX ACADEMY', logo: 'logo.png', line1: '', line2: '' };

    const $ = function (id) { return document.getElementById(id); };
    const esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
    const money = function (n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); };
    const FRESH_MS = 120000;
    let isEditing = false, matched = [], current = null, token = 0, liveTimer = null;
    const idx = { rows: null, at: 0, promise: null };

    /* ---------- student index (ek baar load, phir browser me search) ---------- */
    function loadIndex(force) {
        if (idx.promise) return idx.promise;
        if (!force && idx.rows && Date.now() - idx.at < FRESH_MS) return Promise.resolve(idx.rows);
        idx.promise = fetch(API_URL + "?action=getReports")
            .then(function (res) { return res.json(); })
            .then(function (d) {
                if (d && d.status === "success" && Array.isArray(d.data)) { idx.rows = d.data; idx.at = Date.now(); return idx.rows; }
                throw new Error((d && d.message) || 'Bad response');
            })
            .finally(function () { idx.promise = null; });
        return idx.promise;
    }
    function matches(rows, q, live) {
        const ql = q.toLowerCase(), strict = live && q.length < 3;
        return rows.filter(function (s) { return String(s.uid).toLowerCase() === ql || (!strict && String(s.mobile).includes(q)); });
    }

    function showMatches(list) {
        matched = list;
        const area = $('multiStudentArea');
        area.querySelector('h3').innerHTML = list.length > 1
            ? '<i class="fa-solid fa-users"></i> Multiple Students Found. Select Profile:'
            : '<i class="fa-solid fa-user-check"></i> Student Found. Select Profile:';
        const box = $('miniCardContainer');
        box.innerHTML = '';
        list.forEach(function (s, i) {
            const c = document.createElement('div');
            c.className = 'mini-card';
            c.innerHTML = '<h4><i class="fa-solid fa-user"></i> ' + esc(s.name) + '</h4>' +
                '<p><strong style="color:#00f3ff;">UID:</strong> ' + esc(s.uid) + '</p>' +
                '<p><strong>Father:</strong> ' + esc(s.father) + '</p><p><strong>Class:</strong> ' + esc(s.class) + '</p>';
            c.addEventListener('click', function () { window.loadStudentIntoProfile(i); });
            box.appendChild(c);
        });
        area.style.display = 'block';
    }

    /* ---------- live typing ---------- */
    function onType() {
        clearTimeout(liveTimer);
        liveTimer = setTimeout(function () {
            const q = $('profileSearchInput').value.trim();
            const area = $('multiStudentArea');
            if (!q) { area.style.display = 'none'; return; }
            if (!idx.rows || Date.now() - idx.at >= FRESH_MS) { loadIndex().then(onType).catch(function () {}); return; }
            const m = matches(idx.rows, q, true);
            if (m.length) { $('profileCard').style.display = 'none'; showMatches(m); } else area.style.display = 'none';
        }, 150);
    }

    /* ---------- search (Enter / button) ---------- */
    window.searchProfile = function () {
        const query = $('profileSearchInput').value.trim();
        const btn = $('profSearchBtn'), loader = $('loadingIndicator');

        if (!query) {
            Swal.fire({ icon: 'warning', title: 'Input Required', text: 'Please enter Student UID or Mobile!', background: '#050914', color: '#00f3ff' });
            return;
        }
        $('profileCard').style.display = 'none';
        $('multiStudentArea').style.display = 'none';

        const run = function (rows) {
            const found = matches(rows, query, false);
            if (!found.length) { Swal.fire({ icon: 'error', title: 'Not Found', text: 'No student found.', background: '#050914', color: '#ff0055' }); return; }
            if (found.length === 1) { matched = found; window.loadStudentIntoProfile(0); } else showMatches(found);
        };

        if (idx.rows && !idx.promise && Date.now() - idx.at < FRESH_MS) { run(idx.rows); return; }

        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> FETCHING...';
        btn.style.opacity = '0.7';
        if (loader) loader.style.display = 'flex';
        loadIndex(false).then(run)
            .catch(function (err) {
                console.error(err);
                Swal.fire({ icon: 'error', title: 'Network Error', text: 'Could not connect to database.', background: '#050914', color: '#ff0055' });
            })
            .finally(function () {
                btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> SEARCH';
                btn.style.opacity = '1';
                if (loader) loader.style.display = 'none';
            });
    };

    /* ---------- profile load: basic turant, ledger peeche se ---------- */
    function setDues(n) {
        const el = $('p_dues_alert');
        if (n > 0) { el.innerHTML = 'Pending Dues: ₹' + n; el.style.display = 'block'; } else el.style.display = 'none';
    }
    function ledgerMsg(html) {
        $('paymentHistoryBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:#a5c3e0; padding: 20px;">' + html + '</td></tr>';
    }
    function parseDT(s) { const d = new Date(String(s == null ? '' : s).replace(' ', 'T')); return isNaN(d.getTime()) ? null : d; }
    function renderLedger(history) {
        const body = $('paymentHistoryBody');
        if (!history || !history.length) { ledgerMsg('No payment history found.'); return; }
        body.innerHTML = [...history].reverse().map(function (row) {
            const d = parseDT(row.date);
            const f = d ? d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : row.date;
            return '<tr><td><i class="fa-regular fa-calendar-days" style="color:#00f3ff;"></i> ' + esc(f) + '</td>' +
                '<td><strong style="color:#00ff88;">₹' + esc(row.amount) + '</strong></td><td>' + esc(row.mode) + '</td><td>' + esc(row.remarks || 'Fee Payment') + '</td></tr>';
        }).join('');
    }
    function fetchFull(uid) {
        return fetch(API_URL + "?action=searchProfile&uid=" + encodeURIComponent(uid), { method: 'GET', redirect: 'follow' })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (d.status !== "success") throw new Error(d.message || 'Not found');
                const arr = Array.isArray(d.data) ? d.data : [d.data];
                return arr.find(function (x) { return String(x.uid).trim() === String(uid).trim(); }) || arr[0];
            });
    }
    function startFull(s) {
        const my = ++token;
        current.full = null;
        ledgerMsg('<i class="fa-solid fa-spinner fa-spin"></i> Ledger load ho raha hai...');
        current.fullPromise = fetchFull(s.uid).then(function (full) {
            if (my !== token) return null;
            current.full = full;
            setDues(parseFloat(full.remainingDues) || 0);
            renderLedger(full.history);
            return full;
        }).catch(function (err) {
            console.error(err);
            if (my === token) ledgerMsg('<span style="color:#ff0055;">Ledger load nahi hua.</span> <button type="button" class="btn-retry-l" data-retry="1">Retry</button>');
            return null;
        });
    }

    window.loadStudentIntoProfile = function (index) {
        const s = matched[index];
        if (!s) return;
        current = { base: s, full: null, fullPromise: null };
        $('p_uid').value = s.uid;
        $('p_name').value = s.name;
        $('p_father').value = s.father;
        $('p_mobile').value = s.mobile;
        $('p_aadhar').value = '';
        $('p_class').value = s.class;
        $('p_subject').value = s.subjects;
        $('p_status').value = s.status;
        setDues(parseFloat(s.dues) || 0);

        $('multiStudentArea').style.display = 'none';
        $('profileCard').style.display = 'block';
        if (isEditing) window.toggleEdit();
        startFull(s);
    };

    window.toggleEdit = function () {
        const inputs = document.querySelectorAll('.profile-input');
        const btn = $('editBtn');
        if (!isEditing) {
            inputs.forEach(function (i) { i.removeAttribute('readonly'); i.classList.remove('locked'); i.classList.add('editable'); });
            btn.innerHTML = '<i class="fa-solid fa-check"></i> SAVE CHANGES';
            btn.style.background = 'rgba(0, 243, 255, 0.2)'; btn.style.borderColor = '#00f3ff'; btn.style.color = '#00f3ff';
            isEditing = true;
        } else {
            inputs.forEach(function (i) { i.setAttribute('readonly', 'true'); i.classList.remove('editable'); i.classList.add('locked'); });
            btn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> EDIT DETAILS';
            btn.style.background = 'rgba(255, 170, 0, 0.15)'; btn.style.borderColor = '#ffaa00'; btn.style.color = '#ffaa00';
            isEditing = false;
            Swal.fire({ title: 'Details Locked', text: 'Profile modifications saved locally.', icon: 'success', background: '#050914', color: '#00ff88', confirmButtonColor: '#00f3ff' });
        }
    };

    /* ---------- professional print / PDF ---------- */
    function fmtD(v) {
        if (v == null || v === '') return '';
        const d = (v instanceof Date) ? v : new Date(String(v).replace(' ', 'T'));
        return isNaN(d.getTime()) ? String(v) : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }
    function fmtDT(v) {
        const d = parseDT(v);
        return d ? d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + ', ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : String(v || '');
    }

    function buildPrintHtml() {
        const b = current.base, f = current.full || {};
        const val = function (id) { return $(id).value.trim(); };
        const status = val('p_status');
        const active = status.toLowerCase() === 'active';
        const plan = f.feePlan || b.feePlan || '';
        const feeLabel = String(plan).toLowerCase() === 'monthly' ? 'Monthly Fee' : 'Total Fee';
        const paid = f.todayPayment != null ? f.todayPayment : b.paid;
        const dues = parseFloat(f.remainingDues != null ? f.remainingDues : b.dues) || 0;
        const nextDue = (f.nextDueDate && f.nextDueDate !== '-') ? fmtD(f.nextDueDate) : '-';

        const pairs = [
            ['Student Name', val('p_name')], ['Father Name', val('p_father')], ['UID / Roll No.', val('p_uid')], ['Class', val('p_class')],
            ['Mobile No.', val('p_mobile')], ['Parent Mobile', f.parentMobile], ['Date of Birth', fmtD(f.dob)], ['Admission Date', fmtD(f.admissionDate)],
            ['School', f.schoolName], ['District', f.district], ['Branch', f.branch], ['Session', b.session]
        ].filter(function (p) { return p[1] !== '' && p[1] != null; });
        let infoRows = '';
        for (let i = 0; i < pairs.length; i += 2) {
            const a = pairs[i], c = pairs[i + 1];
            infoRows += '<tr><td class="k">' + a[0] + '</td><td class="v">' + esc(a[1]) + '</td>' + (c ? '<td class="k">' + c[0] + '</td><td class="v">' + esc(c[1]) + '</td>' : '<td></td><td></td>') + '</tr>';
        }
        const subj = val('p_subject');
        infoRows += '<tr><td class="k">Subjects</td><td class="v" colspan="3">' + esc(subj || '-') + '</td></tr>' +
            '<tr><td class="k">Status</td><td class="v" colspan="3"><span class="pd-badge" style="background:' + (active ? '#e3f8ee' : '#fde8ee') + ';color:' + (active ? '#0a8f5a' : '#d6194f') + ';">' + esc(status || '-') + '</span></td></tr>';

        const hist = f.history || [];
        let total = 0;
        const ledger = hist.length ? hist.map(function (r, i) {
            total += parseFloat(r.amount) || 0;
            return '<tr><td>' + (i + 1) + '</td><td>' + esc(fmtDT(r.date)) + '</td><td>' + esc(r.mode) + '</td><td>' + esc(r.remarks || 'Fee Payment') + '</td><td class="r">' + money(r.amount) + '</td></tr>';
        }).join('') : '<tr><td colspan="5" style="text-align:center;color:#6b7a99;">No payment history found.</td></tr>';

        const sub = [ACADEMY.line1, ACADEMY.line2].filter(Boolean).map(esc).join(' | ');
        const today = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

        return '<div class="pd-head"><img class="pd-logo" src="' + esc(ACADEMY.logo) + '" onerror="this.style.display=\'none\'" alt="">' +
            '<div class="pd-org"><b>' + esc(ACADEMY.name) + '</b><span>STUDENT PROFILE &amp; FEE STATEMENT</span>' + (sub ? '<em>' + sub + '</em>' : '') + '</div>' +
            '<div class="pd-ref"><small>Statement Date</small><b>' + today + '</b><small>UID</small><b>' + esc(val('p_uid')) + '</b></div></div><div class="pd-line"></div>' +
            '<div class="pd-sec">Student Information</div><table class="pd-info">' + infoRows + '</table>' +
            '<div class="pd-sec">Fee Summary</div><div class="pd-stats">' +
            '<div class="pd-stat"><small>Fee Plan</small><b>' + esc(plan || '-') + '</b></div>' +
            '<div class="pd-stat"><small>' + feeLabel + '</small><b>' + money(f.totalFee) + '</b></div>' +
            '<div class="pd-stat"><small>Total Paid</small><b style="color:#0a8f5a;">' + money(paid) + '</b></div>' +
            '<div class="pd-stat"><small>Pending Dues</small><b style="color:' + (dues > 0 ? '#d6194f' : '#0a8f5a') + ';">' + money(dues) + '</b></div>' +
            '<div class="pd-stat"><small>Next Due Date</small><b>' + esc(nextDue) + '</b></div></div>' +
            '<div class="pd-sec">Payment Ledger</div><table class="pd-led"><thead><tr><th style="width:6%">#</th><th>Date &amp; Time</th><th>Mode</th><th>Remarks</th><th class="r">Amount</th></tr></thead><tbody>' + ledger + '</tbody>' +
            (hist.length ? '<tfoot><tr><td colspan="4" class="r">Total Paid</td><td class="r">' + money(total) + '</td></tr></tfoot>' : '') + '</table>' +
            '<div class="pd-sign"><div>Parent / Guardian Signature</div><div>Authorised Signatory</div></div>' +
            '<div class="pd-note">This is a computer generated statement. Generated on ' + today + '.</div>';
    }

    function printNow() {
        const old = $('pxPrintDoc'); if (old) old.remove();
        const doc = document.createElement('div');
        doc.id = 'pxPrintDoc';
        doc.innerHTML = buildPrintHtml();
        document.body.appendChild(doc);
        const img = doc.querySelector('.pd-logo');
        new Promise(function (res) {
            if (!img || img.complete) return res();
            img.onload = img.onerror = res;
            setTimeout(res, 2000);
        }).then(function () { window.print(); });
    }

    window.generateProfilePDF = function () {
        if (!current) return;
        if (isEditing) window.toggleEdit();
        const go = function () {
            if (!current.full) {
                Swal.fire({ icon: 'warning', title: 'Ledger load nahi hua', text: 'Pehle Retry dabakar ledger load karein, phir PDF banayein.', background: '#050914', color: '#ffaa00' });
                return;
            }
            printNow();
        };
        setTimeout(function () { (current.fullPromise || Promise.resolve()).then(go); }, 400);
    };

    /* ---------- wiring ---------- */
    const input = $('profileSearchInput');
    if (input) {
        input.addEventListener('input', onType);
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter') window.searchProfile(); });
    }
    $('paymentHistoryBody').addEventListener('click', function (e) {
        if (e.target.closest('[data-retry]') && current) startFull(current.base);
    });
    loadIndex().catch(function () {}); // page khulte hi background me index tayyar
})();
</script>
