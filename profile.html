<style>
    .profile-wrapper { padding: 10px; }
    
    .module-header { 
        color: #00f3ff; font-family: 'Orbitron', sans-serif; margin-bottom: 25px; 
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); border-bottom: 1px solid rgba(0, 243, 255, 0.2); 
        padding-bottom: 10px; display: flex; align-items: center; gap: 15px;
    }

    .profile-container {
        background: rgba(11, 16, 33, 0.8); padding: 30px; border-radius: 12px;
        border: 1px solid rgba(0, 243, 255, 0.2); box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.05);
        max-width: 900px; margin: 0 auto; backdrop-filter: blur(5px);
    }
    
    .search-section { display: flex; gap: 15px; margin-bottom: 30px; }
    .search-section input {
        flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 243, 255, 0.3);
        padding: 12px 18px; border-radius: 8px; color: #fff; font-size: 15px;
        font-family: 'Poppins', sans-serif; outline: none; transition: 0.3s;
    }
    .search-section input:focus {
        border-color: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); background: rgba(0, 243, 255, 0.05);
    }
    .cyber-search-btn {
        background: rgba(0, 243, 255, 0.1); border: 1px solid #00f3ff; color: #00f3ff;
        padding: 0 30px; border-radius: 8px; cursor: pointer; font-family: 'Orbitron', sans-serif;
        font-weight: bold; letter-spacing: 1px; transition: 0.3s; box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }
    .cyber-search-btn:hover { background: #00f3ff; color: #050914; box-shadow: 0 0 20px rgba(0, 243, 255, 0.6); transform: translateY(-2px); }

    /* 🔥 NEW: Mini Cards for Multiple Students */
    #multiStudentArea { display: none; margin-bottom: 30px; animation: fadeIn 0.4s; }
    #multiStudentArea h3 { color: #b366ff; font-size: 16px; margin-bottom: 15px; font-family: 'Orbitron', sans-serif; }
    .mini-card-container { display: flex; flex-wrap: wrap; gap: 15px; }
    .mini-card {
        background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0, 243, 255, 0.3);
        border-radius: 8px; padding: 15px; cursor: pointer; transition: 0.3s; width: calc(50% - 8px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .mini-card:hover { background: rgba(0, 243, 255, 0.15); border-color: #00f3ff; box-shadow: 0 0 15px rgba(0,243,255,0.3); transform: translateY(-3px); }
    .mini-card h4 { color: #00f3ff; font-family: 'Orbitron', sans-serif; margin-bottom: 5px; font-size: 15px; }
    .mini-card p { color: #a5c3e0; font-size: 13px; margin: 2px 0; font-family: 'Poppins', sans-serif; }

    #profileCard {
        display: none; border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 12px;
        overflow: hidden; background: rgba(0, 0, 0, 0.4); box-shadow: 0 0 25px rgba(0, 243, 255, 0.1);
        animation: fadeIn 0.4s ease-in;
    }

    .profile-header {
        background: linear-gradient(135deg, rgba(0, 243, 255, 0.15) 0%, rgba(179, 102, 255, 0.2) 100%);
        color: white; text-align: center; padding: 25px; border-bottom: 1px solid rgba(0, 243, 255, 0.3);
    }
    .profile-header h2 { margin: 0; font-size: 24px; color: #00f3ff; font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px rgba(0,243,255,0.5); display: flex; align-items: center; justify-content: center; gap: 15px;}
    .profile-header p { margin: 8px 0 0; color: #a5c3e0; font-size: 14px; letter-spacing: 1px; }
    
    .profile-actions {
        padding: 15px 25px; background: rgba(0, 0, 0, 0.6); border-bottom: 1px solid rgba(0, 243, 255, 0.2);
        display: flex; justify-content: flex-end; gap: 15px;
    }
    .action-btn {
        padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;
        display: flex; align-items: center; gap: 8px; font-family: 'Orbitron', sans-serif; font-size: 13px; transition: 0.3s;
    }
    .btn-edit { background: rgba(255, 170, 0, 0.15); border: 1px solid #ffaa00; color: #ffaa00; }
    .btn-save-pdf { background: rgba(0, 255, 136, 0.15); border: 1px solid #00ff88; color: #00ff88; }
    
    .profile-body { padding: 30px; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 35px; }
    .info-group { display: flex; flex-direction: column; gap: 8px; }
    .info-group label { font-size: 12px; color: #a5c3e0; font-weight: 600; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    .info-group input {
        padding: 12px 15px; border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 6px;
        font-size: 15px; color: #fff; font-weight: 500; background: rgba(0, 0, 0, 0.4); outline: none;
    }
    .info-group input.editable { border-color: #00f3ff; background: rgba(0, 243, 255, 0.05); color: #fff; }
    .info-group input.locked { pointer-events: none; opacity: 0.8; }

    .history-section h3 {
        color: #b366ff; margin-bottom: 15px; font-family: 'Orbitron', sans-serif; font-size: 16px; 
        border-bottom: 1px solid rgba(179, 102, 255, 0.3); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    }
    .history-table { width: 100%; border-collapse: collapse; }
    .history-table th, .history-table td { padding: 14px; text-align: left; border-bottom: 1px solid rgba(0, 243, 255, 0.15); font-size: 14px; color: #a5c3e0; }
    .history-table th { background: rgba(0, 0, 0, 0.6); color: #00f3ff; font-family: 'Orbitron', sans-serif; font-size: 13px; }
    
    .dues-alert { color: #ff0055; font-weight: bold; background: rgba(255,0,85,0.1); padding: 4px 10px; border-radius: 4px; font-size: 13px; }

    @media print {
        body * { visibility: hidden; }
        .profile-container, .profile-container * { visibility: visible; }
        .profile-container { position: absolute; left: 0; top: 0; width: 100%; }
        .search-section, .profile-actions, #multiStudentArea { display: none !important; }
    }
</style>

<div class="profile-wrapper">
    <h2 class="module-header"><i class="fa-solid fa-id-card"></i> STUDENT PROFILE & RECORDS</h2>

    <div class="profile-container" id="printableProfileArea">
        
        <div class="search-section">
            <input type="text" id="profileSearchInput" placeholder="Enter Student UID or Mobile No.">
            <button class="cyber-search-btn" id="profSearchBtn" onclick="searchProfile()"><i class="fa-solid fa-magnifying-glass"></i> SEARCH</button>
        </div>

        <!-- 🔥 NEW: Selection Area for Multiple Matches -->
        <div id="multiStudentArea">
            <h3><i class="fa-solid fa-users"></i> Multiple Students Found. Select Profile:</h3>
            <div class="mini-card-container" id="miniCardContainer">
                <!-- Mini cards will load here -->
            </div>
        </div>

        <div id="profileCard">
            <div class="profile-header">
                <h2><img src="logo.png" style="width: 45px; height: 45px; border-radius: 50%; margin-right: 12px; vertical-align: middle; object-fit: cover;"> PURIX ACADEMY</h2>
                <p>Student Academic & Financial Dossier</p>
            </div>

            <div class="profile-actions">
                <button class="action-btn btn-edit" id="editBtn" onclick="toggleEdit()"><i class="fa-solid fa-pen-to-square"></i> EDIT DETAILS</button>
                <button class="action-btn btn-save-pdf" onclick="generateProfilePDF()"><i class="fa-solid fa-file-pdf"></i> SAVE AS PDF</button>
            </div>

            <div class="profile-body">
                <form id="profileForm">
                    <div class="info-grid">
                        <div class="info-group"><label>UID (Roll No)</label><input type="text" id="p_uid" class="locked" readonly></div>
                        <div class="info-group"><label>Student Name</label><input type="text" id="p_name" class="locked" readonly></div>
                        <div class="info-group"><label>Father Name</label><input type="text" id="p_father" class="locked" readonly></div>
                        <div class="info-group"><label>Mobile No.</label><input type="number" id="p_mobile" class="profile-input locked" readonly></div>
                        <div class="info-group"><label>ID No.</label><input type="text" id="p_aadhar" class="profile-input locked" readonly placeholder="[Aadhaar Redacted]"></div>
                        <div class="info-group"><label>Class / Session</label><input type="text" id="p_class" class="profile-input locked" readonly></div>
                        <div class="info-group" style="grid-column: 1 / -1;">
                            <label>Subjects</label><input type="text" id="p_subject" class="profile-input locked" readonly style="width: 100%; white-space: normal;">
                        </div>
                        <div class="info-group"><label>Status</label><input type="text" id="p_status" class="locked" readonly></div>
                    </div>
                </form>

                <div class="history-section">
                    <h3><span><i class="fa-solid fa-clock-rotate-left"></i> Payment Ledger</span><span id="p_dues_alert" class="dues-alert"></span></h3>
                    <table class="history-table">
                        <thead><tr><th>Date & Time</th><th>Amount Paid</th><th>Method</th><th>Remarks</th></tr></thead>
                        <tbody id="paymentHistoryBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    let isEditing = false;
    let studentDataStore = []; // Array to hold multiple students

    const searchInput = document.getElementById('profileSearchInput');
    if (searchInput) {
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchProfile();
        });
    }

    window.searchProfile = function() {
        const query = document.getElementById('profileSearchInput').value.trim();
        const mainCard = document.getElementById('profileCard');
        const multiArea = document.getElementById('multiStudentArea');
        const btn = document.getElementById('profSearchBtn');
        
        if(!query) {
            Swal.fire({ icon: 'warning', title: 'Input Required', text: 'Please enter Student UID or Mobile!', background: '#050914', color: '#00f3ff' });
            return;
        }

        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> FETCHING...';
        btn.style.opacity = '0.7';
        mainCard.style.display = 'none';
        multiArea.style.display = 'none';

        fetch(API_URL + "?action=searchProfile&uid=" + encodeURIComponent(query), { method: 'GET', redirect: 'follow' })
        .then(res => res.json())
        .then(data => {
            if(data.status === "success") {
                // Ensure data is treated as an array (for new Code.gs) or single object (backward compatible)
                studentDataStore = Array.isArray(data.data) ? data.data : [data.data];
                
                if(studentDataStore.length > 1) {
                    // SHOW MULTIPLE SELECTION CARDS
                    let cardsHTML = '';
                    studentDataStore.forEach((std, index) => {
                        cardsHTML += `
                            <div class="mini-card" onclick="loadStudentIntoProfile(${index}, '${query}')">
                                <h4><i class="fa-solid fa-user"></i> ${std.name}</h4>
                                <p><strong style="color:#00f3ff;">UID:</strong> ${std.uid || query}</p>
                                <p><strong>Father:</strong> ${std.fatherName}</p>
                                <p><strong>Class:</strong> ${std.class}</p>
                            </div>
                        `;
                    });
                    document.getElementById('miniCardContainer').innerHTML = cardsHTML;
                    multiArea.style.display = 'block';
                } else {
                    // EXACTLY ONE STUDENT, LOAD DIRECTLY
                    loadStudentIntoProfile(0, query);
                }
            } else {
                Swal.fire({ icon: 'error', title: 'Not Found', text: 'No student found.', background: '#050914', color: '#ff0055' });
            }
        })
        .catch(err => {
            console.error(err);
            Swal.fire({ icon: 'error', title: 'Network Error', text: 'Could not connect to database.', background: '#050914', color: '#ff0055' });
        })
        .finally(() => {
            btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> SEARCH';
            btn.style.opacity = '1';
        });
    };

    // 🔥 NEW: Function to inject selected student data into the main card
    window.loadStudentIntoProfile = function(index, query) {
        const student = studentDataStore[index];
        
        document.getElementById('p_uid').value = student.uid || query;
        document.getElementById('p_name').value = student.name;
        document.getElementById('p_father').value = student.fatherName;
        document.getElementById('p_mobile').value = student.mobile;
        document.getElementById('p_aadhar').value = student.aadhar || ''; 
        document.getElementById('p_class').value = student.class;
        document.getElementById('p_subject').value = student.subjects;
        document.getElementById('p_status').value = student.status;

        const duesAlert = document.getElementById('p_dues_alert');
        if (student.remainingDues > 0) {
            duesAlert.innerHTML = `Pending Dues: ₹${student.remainingDues}`;
            duesAlert.style.display = 'block';
        } else {
            duesAlert.style.display = 'none';
        }

        const historyBody = document.getElementById('paymentHistoryBody');
        historyBody.innerHTML = '';
        if(student.history && student.history.length > 0) {
            const reversedHistory = [...student.history].reverse();
            reversedHistory.forEach(row => {
                let dateObj = new Date(row.date);
                let formattedDate = !isNaN(dateObj.getTime()) ? dateObj.toLocaleString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : row.date;
                historyBody.innerHTML += `
                    <tr>
                        <td><i class="fa-regular fa-calendar-days" style="color:#00f3ff;"></i> ${formattedDate}</td>
                        <td><strong style="color:#00ff88;">₹${row.amount}</strong></td>
                        <td>${row.mode}</td>
                        <td>${row.remarks || 'Fee Payment'}</td>
                    </tr>`;
            });
        } else {
            historyBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#a5c3e0; padding: 20px;">No payment history found.</td></tr>`;
        }

        document.getElementById('multiStudentArea').style.display = 'none';
        document.getElementById('profileCard').style.display = 'block';
        if(isEditing) toggleEdit();
    };

    window.toggleEdit = function() {
        const inputs = document.querySelectorAll('.profile-input');
        const btn = document.getElementById('editBtn');

        if (!isEditing) {
            inputs.forEach(input => { input.removeAttribute('readonly'); input.classList.remove('locked'); input.classList.add('editable'); });
            btn.innerHTML = '<i class="fa-solid fa-check"></i> SAVE CHANGES';
            btn.style.background = 'rgba(0, 243, 255, 0.2)'; btn.style.borderColor = '#00f3ff'; btn.style.color = '#00f3ff';
            isEditing = true;
        } else {
            inputs.forEach(input => { input.setAttribute('readonly', 'true'); input.classList.remove('editable'); input.classList.add('locked'); });
            btn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> EDIT DETAILS';
            btn.style.background = 'rgba(255, 170, 0, 0.15)'; btn.style.borderColor = '#ffaa00'; btn.style.color = '#ffaa00';
            isEditing = false;
            Swal.fire({ title: 'Details Locked', text: 'Profile modifications saved locally.', icon: 'success', background: '#050914', color: '#00ff88', confirmButtonColor: '#00f3ff' });
        }
    };

    window.generateProfilePDF = function() {
        if(isEditing) toggleEdit();
        setTimeout(() => { window.print(); }, 400); 
    }
})();
</script>
